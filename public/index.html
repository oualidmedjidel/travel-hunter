/* ==================== RENDER ==================== */
const app = document.getElementById("app");
const actionbar = document.getElementById("actionbar");

/**
 * Retrouve après re-rendu l'élément qui avait le focus : son id s'il en a un, sinon la
 * combinaison de TOUS ses attributs data-*.
 *
 * Les boutons du formulaire n'ont pas d'id — compteurs, mois, destinations, préférences.
 * Le focus retombait donc sur <body> à chaque clic, et la navigation au clavier repartait
 * du début de la page. Un seul data-* ne suffit pas : [data-step="adults"] désigne à la
 * fois « − » et « + », d'où la concaténation.
 */
function selecteurFocus(el) {
  if (!el || !el.attributes) return null;
  if (el.id) return "#" + CSS.escape(el.id);
  return [...el.attributes].filter(a => a.name.startsWith("data-"))
    .map(a => `[${a.name}="${CSS.escape(a.value)}"]`).join("") || null;
}

function render() {
  // Le re-render remplace tout le DOM : on restaure le focus et le curseur,
  // sinon toute saisie est interrompue dès qu'un champ déclenche un rendu.
  const active = document.activeElement;
  const sel = selecteurFocus(active);
  let caret = null;
  try { caret = active && "selectionStart" in active ? active.selectionStart : null; } catch { caret = null; }

  app.innerHTML = state.view === "form" ? viewForm()
    : state.view === "veilles" ? viewVeilles()
    : viewResults();
  actionbar.innerHTML = viewActionBar();
  attach();

  // Une phrase, pas la page entière : c'est tout ce que le lecteur d'écran entend.
  const annonce = document.getElementById("annonce");
  if (annonce) {
    annonce.textContent = state.loading
      ? "Recherche en cours…"
      : state.view === "results"
        ? `${state.results.length} séjour${state.results.length > 1 ? "s" : ""} trouvé${state.results.length > 1 ? "s" : ""}`
        : "";
  }

  if (sel) {
    const el = document.querySelector(sel);
    if (el) {
      el.focus({ preventScroll: true });
      if (caret != null) { try { el.setSelectionRange(caret, caret); } catch {} }
    }
  }
}

function attach() {
  const f = state.formData;
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };

  /* --- entiers : toujours coercés, sinon les comparaisons `=== 4` des <select> cassent --- */
  [["adults", 1, 9], ["children", 0, 6], ["babies", 0, 4]].forEach(([id, lo, hi]) => {
    on(id, "change", e => { f[id] = clamp(int(e.target.value, DEFAULTS[id]), lo, hi); syncAges(f); render(); });
  });
  document.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.step, lo = +document.getElementById(id).min, hi = +document.getElementById(id).max;
    f[id] = clamp(f[id] + int(b.dataset.delta), lo, hi); syncAges(f); render();
  }));
  document.querySelectorAll("[data-age]").forEach(inp => inp.addEventListener("change", e => {
    const arr = e.target.dataset.age === "child" ? f.childrenAges : f.babiesAges;
    const lo = e.target.dataset.age === "child" ? 2 : 0, hi = e.target.dataset.age === "child" ? 17 : 23;
    arr[int(e.target.dataset.idx)] = clamp(int(e.target.value, lo), lo, hi);
    e.target.value = arr[int(e.target.dataset.idx)];
  }));

  on("departureDate", "change", e => {
    f.departureDate = e.target.value;
    if (f.returnDate && f.returnDate <= f.departureDate) f.returnDate = addDays(f.departureDate, f.tripDuration);
    render();
  });
  on("returnDate", "change", e => { f.returnDate = e.target.value; render(); });
  on("tripDuration", "change", e => { f.tripDuration = int(e.target.value, DEFAULTS.tripDuration); render(); });
  on("origin", "change", e => {
    f.origin = AIRPORTS.some(a => a.code === e.target.value) ? e.target.value : DEFAULTS.origin;
    state.live = null; state.liveStatus = null;  // les tarifs du précédent départ ne valent plus
    render();
  });
  on("minStars", "change", e => { f.minStars = int(e.target.value, DEFAULTS.minStars); render(); });
  on("pension", "change", e => { f.pension = Object.hasOwn(PENSIONS, e.target.value) ? e.target.value : DEFAULTS.pension; render(); });
  on("schengenOnly", "change", e => { f.schengenOnly = e.target.checked; render(); });
  on("familyHotel", "change", e => { f.familyHotel = e.target.checked; render(); });
  on("bagageSoute", "change", e => { f.bagageSoute = e.target.checked; render(); });
  on("departApres", "change", e => { f.departApres = e.target.value === "" ? null : int(e.target.value); render(); });
  on("retourAvant", "change", e => { f.retourAvant = e.target.value === "" ? null : int(e.target.value); render(); });

  /* sliders : retour visuel immédiat, rendu complet au relâchement */
  const live = (id, outId, fmt, set) => {
    const el = document.getElementById(id), out = document.getElementById(outId);
    if (!el) return;
    el.addEventListener("input", e => { set(e.target.value); if (out) out.textContent = fmt(e.target.value); });
    el.addEventListener("change", render);
  };
  live("maxBudget", "budgetOut", v => eur(v), v => f.maxBudget = int(v, DEFAULTS.maxBudget));
  live("maxTransfer", "transferOut", v => `${int(v)} min`, v => f.maxTransfer = int(v, DEFAULTS.maxTransfer));
  live("minRating", "ratingOut", v => `${num(v).toFixed(1)}/10`, v => f.minRating = num(v, DEFAULTS.minRating));
  live("maxBeachDistance", "beachOut", v => libellePlage(int(v)), v => f.maxBeachDistance = int(v, DEFAULTS.maxBeachDistance));

  document.querySelectorAll("[data-datemode]").forEach(b => b.addEventListener("click", () => {
    f.flexibleDates = b.dataset.datemode === "flexible"; state.error = null; render();
  }));
  document.querySelectorAll("[data-month]").forEach(b => b.addEventListener("click", () => {
    // Choix exclusif : cliquer un mois remplace le précédent. Cliquer le mois déjà choisi
    // ne le retire pas — une chasse sans mois n'a pas de date à envoyer aux fournisseurs.
    f.selectedMonths = [int(b.dataset.month)];
    render();
  }));
  document.querySelectorAll("[data-oublier]").forEach(b => b.addEventListener("click", () => oublierVeille(b.dataset.oublier)));
  /* l'onglet destination écrit enfin dans le state (il ne faisait que changer une classe CSS) */
  document.querySelectorAll("[data-dest]").forEach(b => b.addEventListener("click", () => {
    f.destinationType = b.dataset.dest; render();
  }));
  document.querySelectorAll("[data-destid]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.destid;
    f.destinations = f.destinations.includes(id) ? f.destinations.filter(x => x !== id) : [...f.destinations, id];
    render();
  }));
  document.querySelectorAll("[data-pref]").forEach(b => b.addEventListener("click", () => {
    const p = b.dataset.pref;
    f.preferences = f.preferences.includes(p) ? f.preferences.filter(x => x !== p) : [...f.preferences, p];
    render();
  }));
  document.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => {
    state.sort = b.dataset.sort; render();
  }));
}

/* ==================== BACKEND ==================== */
/**
 * Interroge la fonction serveur qui détient le jeton Duffel.
 * Ne lève jamais : toute panne se traduit par un repli sur les tarifs modélisés,
 * la recherche doit rester utilisable même API éteinte.
 */
/**
 * Dates réellement envoyées aux API. En mode flexible on dérive le 15 du mois choisi :
 * les deux fournisseurs exigent des dates précises, et vols et hôtels doivent porter
 * exactement les mêmes.
 *
 * L'interface n'accepte qu'un mois depuis le 2026-09-22. Auparavant elle en laissait
 * cocher plusieurs et cette fonction ne lisait que le premier, sans le dire : les autres
 * mois n'étaient jamais interrogés. Le choix est devenu exclusif plutôt que d'ouvrir une
 * fenêtre de recherche par mois — ce qui aurait multiplié la durée d'une chasse (14 s
 * mesurées pour 10 destinations) par le nombre de mois.
 */
function datesEffectives(f) {
  if (!f.flexibleDates) return { depart: f.departureDate, retour: f.returnDate };
  if (!f.selectedMonths.length) return { depart: null, retour: null };
  const mois = f.selectedMonths[0];   // l'unique mois retenu par sanitizeForm
  const annee = new Date().getMonth() + 1 >= mois ? new Date().getFullYear() + 1 : new Date().getFullYear();
  const depart = `${annee}-${String(mois).padStart(2, "0")}-15`;
  return { depart, retour: addDays(depart, f.tripDuration) };
}

async function fetchLiveFlights(f) {
  const { depart, retour } = datesEffectives(f);
  if (!depart) return { statut: "erreur", live: null };

  const candidats = DEALS
    .filter(d => f.destinationType !== "specific" || !f.destinations.length || f.destinations.includes(d.id))
    .map(d => d.id).slice(0, 12);   // plafond imposé par la fonction

  const q = new URLSearchParams({
    origin: f.origin,
    destinations: candidats.join(","),
    depart_date: depart,
    adults: String(f.adults)
  });
  // Duffel tarife d'après les âges réels, pas des compteurs : les champs d'âge du
  // formulaire servent enfin à quelque chose.
  if (f.childrenAges.length) q.set("children_ages", f.childrenAges.join(","));
  if (f.babiesAges.length) q.set("infants_ages_months", f.babiesAges.join(","));
  if (retour) q.set("return_date", retour);
  // Exiger la soute change le tarif RETENU, pas seulement l'affichage : c'est le vol le
  // moins cher qui l'inclut qui remonte.
  if (f.bagageSoute) q.set("bagage_soute", "1");
  if (f.departApres !== null) q.set("depart_apres", String(f.departApres));
  if (f.retourAvant !== null) q.set("retour_avant", String(f.retourAvant));

  try {
    const res = await fetch(`/api/flights?${q}`, { signal: AbortSignal.timeout(30000) });
    const data = await res.json();
    if (data.configured === false) return { statut: "non-configure", live: null };
    if (!res.ok || !Array.isArray(data.flights)) return { statut: "erreur", live: null };

    // La devise est celle du compte Duffel, pas un paramètre d'appel. Un tarif qui
    // n'est pas en euros ne peut pas s'additionner à un hôtel estimé en euros : on
    // l'écarte plutôt que d'afficher un total faux.
    const enEuros = data.flights.filter(v => v.currency === "EUR");
    if (!enEuros.length && data.flights.length) return { statut: "devise", live: null, meta: data };

    const live = new Map(enEuros.map(v => [v.destination, v]));
    return { statut: live.size ? "reel" : "erreur", live, meta: data };
  } catch {
    return { statut: "erreur", live: null };
  }
}

/**
 * Interroge la fonction serveur qui détient la clé hôtelière.
 * Ne lève jamais : toute panne retombe sur le tarif hôtel modélisé.
 */
async function fetchLiveStays(f, depart, retour) {
  if (!depart || !retour) return { statut: "erreur", stays: null };
  const candidats = DEALS
    .filter(d => f.destinationType !== "specific" || !f.destinations.length || f.destinations.includes(d.id))
    .filter(d => Number.isFinite(d.lat) && Number.isFinite(d.lon))
    .slice(0, 12);

  const q = new URLSearchParams({
    lieux: candidats.map(d => `${d.id}:${d.lat},${d.lon}`).join(";"),
    check_in: depart,
    check_out: retour,
    adults: String(f.adults),
    pension: f.pension
  });
  if (f.childrenAges.length) q.set("children_ages", f.childrenAges.join(","));
  if (f.babiesAges.length) q.set("infants_ages_months", f.babiesAges.join(","));

  try {
    const res = await fetch(`/api/stays?${q}`, { signal: AbortSignal.timeout(30000) });
    const data = await res.json();
    if (data.configured === false) return { statut: "non-configure", stays: null };
    if (!res.ok || !Array.isArray(data.stays)) return { statut: "erreur", stays: null };

    // Même règle que pour les vols : un tarif qui n'est pas en euros ne peut pas
    // s'additionner au reste. On l'écarte plutôt que d'afficher un total faux.
    const enEuros = data.stays.filter(v => v.currency === "EUR");
    const stays = new Map(enEuros.map(v => [v.cle, v]));
    return { statut: stays.size ? "reel" : "erreur", stays, meta: data };
  } catch {
    return { statut: "erreur", stays: null };
  }
}

/* ==================== VEILLE ====================
 * Surveiller une recherche dans le temps : c'est ce qui sépare un comparateur d'un
 * « hunter ». Le serveur relève les prix toutes les 6 h et garde l'historique ; la page
 * ne fait que créer, lister et supprimer.
 *
 * Aucun compte : un identifiant aléatoire dans le localStorage tient lieu de porte.
 * Qui change de navigateur repart de zéro, et c'est dit dans l'écran.
 */
function proprietaire() {
  try {
    let id = localStorage.getItem("tdh.proprietaire");
    if (!id || id.length < 12) {
      id = "p" + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
      localStorage.setItem("tdh.proprietaire", id);
    }
    return id;
  } catch { return null; }   // navigation privée, stockage refusé : la veille est indisponible
}

/** Critères envoyés au serveur : exactement ce dont un relevé a besoin, rien de plus. */
function criteresVeille(f, dates) {
  const choisies = f.destinationType === "specific" && f.destinations.length
    ? DEALS.filter(d => f.destinations.includes(d.id))
    : DEALS;
  const douze = choisies.slice(0, 12);
  return {
    origin: f.origin,
    destinations: douze.map(d => d.id),
    depart: dates.depart,
    retour: dates.retour || "",
    adults: f.adults,
    childrenAges: f.childrenAges.slice(0, f.children),
    lieux: douze.map(d => `${d.id}:${d.lat},${d.lon}`).join(";")
  };
}

async function surveiller() {
  const id = proprietaire();
  if (!id) { state.veilleMsg = "Le stockage du navigateur est refusé : impossible de retenir une veille."; render(); return; }
  const f = state.formData;
  const dates = datesEffectives(f);
  if (!dates.depart) { state.veilleMsg = "Choisis des dates avant de mettre sous surveillance."; render(); return; }

  state.veilleMsg = "Enregistrement…"; render();
  try {
    const r = await fetch("/api/veille", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: "ajouter", proprietaire: id,
        nom: `${f.origin} · ${dates.depart}`, criteres: criteresVeille(f, dates) })
    });
    const d = await r.json();
    state.veilleMsg = r.ok ? "Sous surveillance. Le premier relevé arrive dans l'heure."
                           : `Refusé : ${d.error || r.status}`;
    if (r.ok) await chargerVeilles();
  } catch { state.veilleMsg = "Le serveur n'a pas répondu."; }
  render();
}

async function chargerVeilles() {
  const id = proprietaire();
  if (!id) { state.veilles = []; return; }
  try {
    const r = await fetch(`/api/veille?proprietaire=${encodeURIComponent(id)}`);
    const d = await r.json();
    state.veilles = Array.isArray(d.veilles) ? d.veilles : [];
  } catch { state.veilles = []; }
}

async function oublierVeille(veilleId) {
  const id = proprietaire();
  if (!id) return;
  try {
    await fetch("/api/veille", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: "supprimer", proprietaire: id, id: veilleId })
    });
  } catch {}
  await chargerVeilles();
  render();
}

/** base64url → octets : la forme qu'exige `pushManager.subscribe`. */
function base64urlVersOctets(s) {
  const base64 = (s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/");
  const brut = atob(base64);
  return Uint8Array.from(brut, c => c.charCodeAt(0));
}

/** Où en sont les notifications sur CET appareil. Jamais deviné : toujours relu. */
async function etatAlertes() {
  if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
    return "indisponibles";
  }
  if (Notification.permission === "denied") return "refusees";
  try {
    const reg = await navigator.serviceWorker.ready;
    const abo = await reg.pushManager.getSubscription();
    return abo ? "actives" : "inactives";
  } catch { return "indisponibles"; }
}

/**
 * Abonne cet appareil. Trois refus possibles, tous dits tels quels : navigateur sans
 * push, permission refusée, service de push injoignable. Aucun « réessayez plus tard ».
 */
async function activerAlertes() {
  const id = proprietaire();
  if (!id) { state.veilleMsg = "Le stockage du navigateur est refusé : impossible de t'identifier."; render(); return; }
  if (await etatAlertes() === "indisponibles") {
    state.veilleMsg = "Ce navigateur ne gère pas les notifications poussées."; render(); return;
  }

  state.veilleMsg = "En attente de ton autorisation…"; render();
  const permission = await Notification.requestPermission();
  if (permission !== "granted") {
    state.alertes = permission === "denied" ? "refusees" : "inactives";
    state.veilleMsg = "Notifications refusées. Tu peux revenir sur ce choix dans les réglages du site.";
    render(); return;
  }

  try {
    const reg = await navigator.serviceWorker.ready;
    const d = await (await fetch(`/api/veille?proprietaire=${encodeURIComponent(id)}`)).json();
    if (!d.vapid) throw new Error("clé publique absente");
    const abonnement = await reg.pushManager.subscribe({
      userVisibleOnly: true,                       // exigé par Chrome : pas de push silencieux
      applicationServerKey: base64urlVersOctets(d.vapid)
    });
    const r = await fetch("/api/veille", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: "abonner", proprietaire: id, abonnement: abonnement.toJSON() })
    });
    state.alertes = r.ok ? "actives" : "inactives";
    state.veilleMsg = r.ok
      ? "Alertes activées sur cet appareil. Tu seras prévenu quand un vol passe sous son meilleur prix connu."
      : "Le serveur a refusé l'abonnement.";
  } catch (e) {
    state.alertes = "inactives";
    state.veilleMsg = "Le service de notifications n'a pas répondu.";
  }
  render();
}

/**
 * Envoi d'essai : la seule façon de voir la chaîne complète sans attendre un record.
 * Le serveur emprunte exactement le chemin d'une vraie alerte — si l'essai arrive, une
 * alerte arrivera.
 */
async function testerAlerte() {
  const id = proprietaire();
  if (!id) return;
  state.veilleMsg = "Envoi d'un essai…"; render();
  try {
    const r = await fetch("/api/veille", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: "tester", proprietaire: id })
    });
    const d = await r.json();
    state.veilleMsg = r.ok
      ? (d.sansAbonnement
          ? "Aucun appareil abonné : active d'abord les alertes."
          : `Essai envoyé à ${d.envoyees} appareil${d.envoyees > 1 ? "s" : ""} sur ${d.tentees}. `
            + "La notification peut mettre quelques secondes.")
      : (d.error || `Refusé (${r.status}).`);
  } catch { state.veilleMsg = "Le serveur n'a pas répondu."; }
  render();
}

async function couperAlertes() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const abo = await reg.pushManager.getSubscription();
    if (abo) {
      await fetch("/api/veille", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ action: "desabonner", endpoint: abo.endpoint, proprietaire: proprietaire() })
      });
      await abo.unsubscribe();
    }
  } catch {}
  state.alertes = "inactives";
  state.veilleMsg = "Alertes coupées sur cet appareil.";
  render();
}

async function ouvrirVeilles() {
  state.view = "veilles"; state.veilleMsg = null; render();
  await chargerVeilles();
  state.alertes = await etatAlertes();
  render();
}

/**
 * Retour des actions de veille, affiché dans TOUTES les vues qui les déclenchent.
 *
 * Il ne vivait que dans l'écran « Mes veilles ». Depuis les résultats, appuyer sur
 * « Surveiller » créait bien la veille côté serveur et n'affichait rien : du point de vue
 * de qui appuie, le bouton était mort. Une action sans retour visible n'est pas une
 * action, c'est un doute.
 */
function messageVeille() {
  if (!state.veilleMsg) return "";
  const versVeilles = state.view === "veilles" ? ""
    : ` <button type="button" class="chip" onclick="ouvrirVeilles()">Voir mes veilles</button>`;
  return `<div class="alert alert--info"><span>💬</span><div>${esc(state.veilleMsg)}${versVeilles}</div></div>`;
}

/** « 12 % au-dessus du meilleur prix vu » — ou rien tant qu'un seul relevé existe. */
function ecartTexte(d) {
  if (d.actuel === null || d.meilleur === null) return "en attente du premier relevé";
  if (d.releves < 2) return "premier relevé";
  if (d.ecart === 0) return "au meilleur prix vu";
  return d.ecart > 0 ? `${d.ecart} % au-dessus du meilleur vu` : `${Math.abs(d.ecart)} % sous le précédent`;
}

function viewVeilles() {
  const v = state.veilles;
  const entete = `
    <section class="hero" style="padding-bottom:.5rem">
      <span class="eyebrow">Veille</span>
      <h1>Ce que je surveille</h1>
      <p>Le serveur relève les prix toutes les 6 heures et garde l'historique. Les veilles
         vivent dans ce navigateur : sur un autre appareil, tu ne les verras pas.</p>
    </section>`;

  // L'état des notifications se dit en clair, y compris quand c'est le navigateur qui
  // bloque : un bouton qui ne marcherait pas serait pire qu'une phrase.
  const alertes = {
    actives: `<div class="alert alert--info"><span>🔔</span><div><b>Alertes actives sur cet appareil.</b>
      Tu seras prévenu quand un vol passe sous son meilleur prix connu.
      <button type="button" class="chip" onclick="testerAlerte()">Tester l'alerte</button>
      <button type="button" class="chip" onclick="couperAlertes()">Couper</button></div></div>`,
    inactives: `<div class="alert alert--info"><span>🔕</span><div>Les alertes sont éteintes sur cet appareil.
      <button type="button" class="chip" onclick="activerAlertes()">Activer les alertes</button></div></div>`,
    refusees: `<div class="alert alert--warn"><span>🚫</span><div><b>Notifications refusées pour ce site.</b>
      Le navigateur ne me laissera pas redemander : il faut les réautoriser dans ses réglages.</div></div>`,
    indisponibles: `<div class="alert alert--warn"><span>📵</span><div>Ce navigateur ne gère pas les
      notifications poussées. La veille fonctionne quand même, il faut ouvrir cette page pour voir l'écart.</div></div>`
  }[state.alertes] || "";

  if (v === null) return entete + alertes + messageVeille() + `<p class="footnote">Chargement…</p>`;
  if (!v.length) {
    return entete + alertes + messageVeille() + `<div class="alert alert--info"><span>🔭</span><div>Aucune veille pour
      l'instant. Lance une chasse, puis « Surveiller cette recherche ».</div></div>`;
  }

  const cartes = v.map(x => {
    const lignes = x.destinations.slice(0, 12).map(d => `
      <div class="spec"><span class="spec__k">${esc(d.code)}</span>
        <span class="spec__v num">${d.actuel === null ? "—" : eur(d.actuel)}
          <small>${esc(ecartTexte(d))}</small></span></div>`).join("");
    return `<article class="deal">
      <div class="deal__top">
        <div><div class="deal__dest">${esc(x.nom)}</div>
          <div class="deal__sub">${esc(x.criteres.depart)}${x.criteres.retour ? " → " + esc(x.criteres.retour) : ""}
            · ${x.criteres.adults} adulte${x.criteres.adults > 1 ? "s" : ""}
            ${x.mode === "test" ? `<span class="badge badge--test">prix de test</span>` : ""}</div></div>
      </div>
      <div class="specs">${lignes || `<span class="hint">Aucun relevé exploitable pour l'instant.</span>`}</div>
      <p class="footnote">${x.dernierReleve ? "Dernier relevé : " + esc(x.dernierReleve.replace("T", " ").slice(0, 16)) : "Aucun relevé encore"}
        — <button type="button" class="chip" data-oublier="${esc(x.id)}">Ne plus surveiller</button></p>
    </article>`;
  }).join("");

  return entete + alertes + messageVeille() + `<div class="deals">${cartes}</div>`;
}

/* ==================== ACTIONS ==================== */
async function hunt() {
  const f = state.formData;
  const err = validate(f);
  if (err) {
    state.error = err; state.view = "form"; render();
    document.querySelector(".alert--err")?.scrollIntoView({ block: "center" });
    return;
  }
  state.error = null;
  state.view = "results";
  state.loading = true;
  render();
  window.scrollTo({ top: 0 });

  // Les deux appels durent ~15 s chacun : en série ce serait 30 s, en parallèle 15.
  const dates = datesEffectives(f);

  // Chaque source passe à « interrogation… », puis rend compte dès QU'ELLE répond —
  // sans attendre l'autre. L'état affiché est donc l'état réel, pas une mise en scène.
  state.sources = { vols: "encours", hotels: "encours", modele: "ok" };
  state.sourcesN = { modele: DEALS.length };
  render();

  const [vols, hotels] = await Promise.all([
    fetchLiveFlights(f).then(r => {
      state.sourcesN.vols = (r.live || []).length;
      state.sources.vols = etatDepuisReponse(r.statut, state.sourcesN.vols);
      if (state.loading) render();
      return r;
    }),
    fetchLiveStays(f, dates.depart, dates.retour).then(r => {
      state.sourcesN.hotels = (r.stays || []).length;
      state.staysFournisseur = r.meta && r.meta.fournisseur ? r.meta.fournisseur : null;
      state.sources.hotels = etatDepuisReponse(r.statut, state.sourcesN.hotels);
      if (state.loading) render();
      return r;
    })
  ]);
  state.live = vols.live;
  state.liveStatus = vols.statut;
  state.liveMode = vols.meta && vols.meta.mode ? vols.meta.mode : null;
  state.stays = hotels.stays;
  state.staysStatus = hotels.statut;
  state.staysFournisseur = hotels.meta && hotels.meta.fournisseur ? hotels.meta.fournisseur : null;
  state.staysMode = hotels.meta && hotels.meta.mode ? hotels.meta.mode : null;

  const { rows, rejected } = search(f, vols.live, hotels.stays);
  state.results = rows;
  state.lastReason = topReason(rejected);
  state.loading = false;
  render();
}

function goBack() { state.view = "form"; render(); window.scrollTo({ top: 0 }); }

function readSaved() {
  try {
    const raw = JSON.parse(localStorage.getItem("tdh.searches") || "{}");
    return raw && typeof raw === "object" ? raw : {};
  } catch { return {}; }
}
function writeSaved(obj) {
  try { localStorage.setItem("tdh.searches", JSON.stringify(obj)); return true; }
  catch { return false; }
}

function saveSearch() {
  const name = prompt("Nom de la recherche :", "Vacances " + MONTHS[new Date().getMonth()]);
  if (!name) return;
  const all = readSaved();
  all[name.slice(0, 60)] = { data: state.formData, date: new Date().toISOString() };
  if (!writeSaved(all)) { alert("Impossible de sauvegarder (stockage indisponible)."); return; }
  openSaved();
}

function openSaved() {
  const all = readSaved();
  const names = Object.keys(all);
  const body = document.getElementById("savedBody");
  body.innerHTML = names.length
    ? names.map(n => `
      <div class="saved">
        <div class="saved__n">
          <b>${esc(n)}</b>
          <span>${esc(new Date(all[n]?.date || Date.now()).toLocaleDateString("fr-FR"))}</span>
        </div>
        <button class="btn btn--primary" data-load="${esc(n)}">Charger</button>
        <button class="link-btn" data-del="${esc(n)}">Supprimer</button>
      </div>`).join("")
    : `<p class="hint" style="text-align:center;padding:1rem 0">Aucune recherche sauvegardée pour l'instant.</p>`;

  body.querySelectorAll("[data-load]").forEach(b => b.addEventListener("click", () => {
    // sanitizeForm : une sauvegarde corrompue ou hostile ne peut ni planter le rendu ni injecter de HTML
    state.formData = sanitizeForm(readSaved()[b.dataset.load]?.data);
    state.error = null;
    document.getElementById("savedDlg").close();
    state.view = "form"; render(); window.scrollTo({ top: 0 });
  }));
  body.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    const all2 = readSaved(); delete all2[b.dataset.del]; writeSaved(all2); openSaved();
  }));

  document.getElementById("savedDlg").showModal();
}

/* ==================== THEME ==================== */
(function theme() {
  let mode = null;
  try { mode = localStorage.getItem("tdh.theme"); } catch {}
  if (mode === "dark" || mode === "light") document.documentElement.dataset.theme = mode;
  document.getElementById("themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("tdh.theme", next); } catch {}
  });
})();

/* ==================== SELF-CHECK (?selftest=1) ==================== */
function selfCheck() {
  const out = [];
  const ok = (name, cond) => out.push((cond ? "PASS " : "FAIL ") + name);
  try { corpsDesTests(ok, out); }
  catch (e) {
    // Une exception dans une assertion faisait taire TOUT l'auto-test : elle
    // devient un échec visible, et les assertions déjà passées sont conservées.
    out.push("FAIL exception pendant les tests : " + (e && e.message ? e.message : e));
  }

  const failed = out.filter(l => l.startsWith("FAIL"));
  console.log(out.join("\n"));
  console.log(failed.length ? `❌ ${failed.length}/${out.length} échecs` : `✅ ${out.length}/${out.length} OK`);
  return { total: out.length, failed: failed.length, lines: out };
}

function corpsDesTests(ok, out) {
  const base = sanitizeForm({ adults: 2, children: 0, babies: 0, pension: "petit-dej", maxBudget: 99999, minStars: 3, minRating: 0, maxTransfer: 240, familyHotel: false });

  const d = DEALS.find(x => x.id === "LIS");
  const p = priceDeal(d, base, 7);
  ok("vol = base × 2 adultes", p.priceFlight === d.flightBase * 2);
  ok("hôtel = tarif × nuits × 1 chambre", p.priceHotel === d.hotelRate * 7);
  ok("total = vol + hôtel + transfert", p.total === p.priceFlight + p.priceHotel + p.priceExtra);

  const ai = priceDeal(d, { ...base, pension: "all-inclusive" }, 7);
  ok("all-inclusive coûte plus cher que petit-déj", ai.priceHotel > p.priceHotel);

  const big = priceDeal(d, { ...base, adults: 4, children: 2 }, 7);
  ok("6 personnes = 2 chambres", big.rooms === 2);

  // La page et netlify/functions/stays.mjs doivent compter les chambres à l'identique :
  // le tarif hôtelier réel est multiplié côté fonction et affiché ici. Une divergence
  // afficherait un nombre de chambres qui ne correspond pas au prix.
  ok("jamais plus de chambres que d'adultes",
     priceDeal(d, { ...base, adults: 1, children: 3 }, 7).rooms === 1 &&
     priceDeal(d, { ...base, adults: 1, children: 8 }, 7).rooms === 1 &&
     priceDeal(d, { ...base, adults: 2, children: 5 }, 7).rooms === 2);
  ok("le calcul par couchages est inchangé quand les adultes suffisent",
     priceDeal(d, { ...base, adults: 9, children: 0 }, 7).rooms === 3 &&
     priceDeal(d, { ...base, adults: 2, children: 0 }, 7).rooms === 1);
  ok("plus de voyageurs = plus cher", big.total > p.total);

  ok("14 nuits coûtent plus que 7", priceDeal(d, base, 14).total > p.total);

  // À 1 200 € rien ne passait : [].every() vaut true, l'assertion était vraie même
  // filtre débranché. À 1 500 €, trois séjours restent et sept sont écartés — elle voit
  // donc le filtre garder ET rejeter.
  const budget = search({ ...base, maxBudget: 1500 });
  ok("filtre budget appliqué",
     budget.rows.length > 0 && budget.rejected.budget > 0
     && budget.rows.every(r => r.total <= 1500));
  const stars = search({ ...base, minStars: 5 });
  ok("filtre étoiles appliqué", stars.rows.every(r => r.stars >= 5) && stars.rows.length > 0);
  const schengen = search({ ...base, schengenOnly: true });
  ok("filtre Schengen appliqué", schengen.rows.every(r => r.schengen));
  const transfer = search({ ...base, maxTransfer: 25 });
  ok("filtre transfert appliqué", transfer.rows.every(r => r.transferMin <= 25));
  const plage = search({ ...base, maxBeachDistance: 2 });
  ok("filtre plage appliqué", plage.rows.length > 0 && plage.rows.every(r => r.beachKm <= 2));
  ok("filtre plage au maximum = aucune limite",
     search({ ...base, maxBeachDistance: PLAGE_LIBRE }).rows.length === search(base).rows.length
     && search({ ...base, maxBeachDistance: PLAGE_LIBRE }).rows.some(r => r.beachKm > PLAGE_LIBRE));
  ok("distance à la plage assainie", sanitizeForm({ ...base, maxBeachDistance: 9999 }).maxBeachDistance === PLAGE_LIBRE
     && sanitizeForm({ ...base, maxBeachDistance: -3 }).maxBeachDistance === 1
     && sanitizeForm({ ...base, maxBeachDistance: "sept" }).maxBeachDistance === base.maxBeachDistance);

  ok("mode flexible validé sans dates", validate({ ...base, flexibleDates: true, selectedMonths: [5], tripDuration: 7 }) === null);
  ok("mode flexible refusé sans mois", validate({ ...base, flexibleDates: true, selectedMonths: [], tripDuration: 7 }) !== null);

  // Le mois est un choix exclusif : l'interface ne doit plus promettre ce que la chasse
  // n'interroge pas. Une recherche sauvegardée avec plusieurs mois est ramenée au premier.
  ok("un seul mois survit à l'assainissement",
     sanitizeForm({ selectedMonths: [4, 5, 9] }).selectedMonths.length === 1
     && sanitizeForm({ selectedMonths: [4, 5, 9] }).selectedMonths[0] === 4);
  ok("un mois hors bornes est écarté avant d'être retenu",
     sanitizeForm({ selectedMonths: [0, 13, 7] }).selectedMonths[0] === 7);
  const flex = { ...base, flexibleDates: true, selectedMonths: [4], tripDuration: 7 };
  const dFlex = datesEffectives(flex);
  ok("la date sondée est le 15 du mois choisi",
     /^\d{4}-04-15$/.test(dFlex.depart) && dFlex.retour === addDays(dFlex.depart, 7));
  ok("le mois interrogé est bien celui qui est affiché",
     datesEffectives({ ...flex, selectedMonths: [11] }).depart.slice(5, 7) === "11");
  ok("retour avant départ refusé", validate({ ...base, flexibleDates: false, departureDate: "2099-06-10", returnDate: "2099-06-02" }) !== null);
  // Au-delà de l'horizon, le refus doit venir de la page : les proxys rendraient 400
  // après coup, et l'utilisateur aurait attendu pour rien.
  ok("au-delà de l'horizon de vente, refusé avant l'appel",
     validate({ ...base, flexibleDates: false, departureDate: "2099-06-02", returnDate: "2099-06-10" }) !== null);
  ok("dans l'horizon, accepté",
     validate({ ...base, flexibleDates: false, departureDate: addDays(today(), 30), returnDate: addDays(today(), 38) }) === null);
  ok("le mode flexible reste dans l'horizon",
     datesEffectives({ ...base, flexibleDates: true, selectedMonths: [new Date().getMonth() + 1], tripDuration: 14 }).retour <= dernierJour());
  // Les dates de 2099 servaient de « dates valides » : elles ne le sont plus depuis que
  // l'horizon de vente est une règle. Un séjour proche les remplace.
  ok("dates valides acceptées",
     validate({ ...base, flexibleDates: false, departureDate: addDays(today(), 45), returnDate: addDays(today(), 53) }) === null);

  ok("HTML échappé", esc('"><img src=x onerror=alert(1)>') === "&quot;&gt;&lt;img src=x onerror=alert(1)&gt;");

  // H — un bouton sans id doit rester retrouvable après re-rendu.
  const btnMois = document.querySelector('[data-month]');
  ok("focus : un bouton sans id est retrouvé par ses data-*",
     btnMois ? document.querySelector(selecteurFocus(btnMois)) !== null : true);
  // « − » et « + » partagent data-step : le sélecteur doit porter les DEUX attributs,
  // sinon le focus revient sur le mauvais bouton.
  const btnPlus = document.querySelector('[data-step][data-delta]');
  ok("focus : un sélecteur porte tous les data-*, pas seulement le premier",
     !btnPlus || (selecteurFocus(btnPlus).includes("data-step") && selecteurFocus(btnPlus).includes("data-delta")));
  ok("focus : un élément sans id ni data-* ne produit pas de sélecteur vide",
     selecteurFocus(document.createElement("span")) === null);
  // I — une seule région live, et ce n'est plus l'application entière.
  ok("une seule région aria-live, hors de #app",
     document.querySelectorAll("[aria-live]").length === 1
     && document.getElementById("annonce")?.hasAttribute("aria-live") === true
     && !document.getElementById("app")?.hasAttribute("aria-live"));
  // Veille — les critères envoyés au serveur doivent porter ce qu'un relevé exige.
  const cv = criteresVeille({ ...base, origin: "PAR", destinationType: "specific", destinations: ["FAO", "LIS"],
                              adults: 2, children: 1, childrenAges: [8] },
                            { depart: "2027-01-10", retour: "2027-01-18" });
  // L'ordre est celui du jeu de séjours, pas celui de la saisie : on compare des
  // ensembles, sinon l'assertion casse au premier réordonnancement de DEALS.
  ok("veille : critères complets pour un relevé",
     cv.origin === "PAR" && [...cv.destinations].sort().join(",") === "FAO,LIS"
     && cv.depart === "2027-01-10" && cv.retour === "2027-01-18"
     && cv.adults === 2 && cv.childrenAges.join(",") === "8");
  ok("veille : les coordonnées suivent, sinon le serveur ne peut pas relever les hôtels",
     cv.lieux.split(";").length === 2
     && cv.lieux.split(";").every(l => /^[A-Z]{3}:-?[\d.]+,-?[\d.]+$/.test(l))
     && cv.destinations.every(d => cv.lieux.includes(d + ":")));
  ok("veille : jamais plus de 12 destinations, c'est le plafond des proxys",
     criteresVeille({ ...base, destinationType: "flexible", destinations: [], childrenAges: [] },
                    { depart: "2027-01-10", retour: "" }).destinations.length <= 12);
  ok("veille : les enfants déclarés en trop ne partent pas",
     criteresVeille({ ...base, children: 1, childrenAges: [8, 9, 10] },
                    { depart: "2027-01-10", retour: "" }).childrenAges.length === 1);
  // L'écart ne se raconte pas avant d'avoir deux points de mesure.
  ok("veille : un seul relevé ne produit pas d'écart",
     ecartTexte({ actuel: 300, meilleur: 300, ecart: 0, releves: 1 }) === "premier relevé");
  ok("veille : sans relevé, on le dit",
     ecartTexte({ actuel: null, meilleur: null, ecart: null, releves: 0 }) === "en attente du premier relevé");
  ok("veille : au meilleur prix vu, l'écart est nommé tel quel",
     ecartTexte({ actuel: 300, meilleur: 300, ecart: 0, releves: 4 }) === "au meilleur prix vu");
  // Le retour d'une action de veille doit être visible depuis l'écran où on l'a déclenchée.
  // Il ne vivait que dans « Mes veilles » : depuis les résultats, le bouton semblait mort.
  ok("veille : le message de retour est rendu quand il existe",
     (() => { const avant = state.veilleMsg; state.veilleMsg = "essai de retour";
              const html = messageVeille(); state.veilleMsg = avant;
              return html.includes("essai de retour"); })());
  ok("veille : aucun bandeau quand il n'y a rien à dire",
     (() => { const avant = state.veilleMsg; state.veilleMsg = null;
              const html = messageVeille(); state.veilleMsg = avant; return html === ""; })());
  ok("veille : les deux vues qui déclenchent une action affichent ce retour",
     viewResults.toString().includes("messageVeille()") && viewVeilles.toString().includes("messageVeille()"));
  ok("veille : un écart positif est rendu en pourcentage",
     ecartTexte({ actuel: 336, meilleur: 300, ecart: 12, releves: 4 }) === "12 % au-dessus du meilleur vu");

  // Bagages — ce que le tarif inclut, et surtout le cas « la source n'a rien dit ».
  ok("bagages : une soute et une cabine se lisent",
     texteBagages({ soute: 1, cabine: 1 }) === "1 en soute · 1 en cabine");
  ok("bagages : l'absence de soute est nommée, pas tue",
     texteBagages({ soute: 0, cabine: 1 }) === "pas de soute · 1 en cabine");
  ok("bagages : sans déclaration, on le dit au lieu d'inventer une absence",
     texteBagages(null) === "bagages non communiqués"
     && texteBagages({ soute: null, cabine: null }) === "bagages non communiqués");
  ok("bagages : une seule information déclarée suffit",
     texteBagages({ soute: 2, cabine: null }) === "2 en soute");
  // Le tarif de démonstration n'a pas de bagages : la carte ne doit pas en inventer.
  ok("bagages : un séjour modélisé n'annonce aucun bagage inclus",
     priceDeal(d, base, 7, null).bagagesReels === null);
  ok("bagages : un tarif réel remonte ce que la source a déclaré",
     priceDeal(d, base, 7, { total: 300, airline: "X", bagages: { soute: 1, cabine: 1 } })
       .bagagesReels.soute === 1);
  // La case à cocher doit atteindre l'API : sans ça, elle ne changerait que l'affichage.
  ok("bagages : la case envoie bien bagage_soute au serveur",
     fetchLiveFlights.toString().includes('q.set("bagage_soute"'));
  ok("bagages : la case est assainie comme un booléen",
     sanitizeForm({ bagageSoute: "oui" }).bagageSoute === false
     && sanitizeForm({ bagageSoute: true }).bagageSoute === true);

  // Tranche horaire — la contrainte doit atteindre l'API, pas rester dans la page.
  // Défaut mesuré en production : les menus n'existaient que dans la branche « Flexible ».
  ok("horaires : les deux menus existent dans le mode de dates par défaut",
     !!document.getElementById("departApres") && !!document.getElementById("retourAvant"));
  ok("horaires : les deux bornes partent au serveur",
     fetchLiveFlights.toString().includes('q.set("depart_apres"')
     && fetchLiveFlights.toString().includes('q.set("retour_avant"'));
  ok("horaires : « peu importe » reste null après assainissement",
     sanitizeForm({ departApres: null }).departApres === null
     && sanitizeForm({ retourAvant: "" }).retourAvant === null);
  ok("horaires : une heure valide survit, une heure absurde est écartée",
     sanitizeForm({ departApres: 8 }).departApres === 8
     && sanitizeForm({ departApres: 42 }).departApres === null
     && sanitizeForm({ retourAvant: -3 }).retourAvant === null);
  ok("horaires : minuit est une heure comme une autre, pas un « rien »",
     sanitizeForm({ departApres: 0 }).departApres === 0);
  ok("horaires : l'atterrissage du retour s'affiche quand il diffère du décollage",
     horaireVol({ departReel: "2026-11-05T09:55:00", retourReel: "2026-11-13T18:25:00",
                  arriveeRetourReel: "2026-11-13T21:10:00", escalesReelles: 0 })
       .includes("18:25 → 21:10"));
  ok("horaires : rien d'inventé quand la source ne donne pas l'atterrissage",
     !horaireVol({ departReel: "2026-11-05T09:55:00", retourReel: "2026-11-13T18:25:00",
                   arriveeRetourReel: null, escalesReelles: 0 }).includes("→"));

  // Alertes — la clé publique VAPID arrive en base64url et doit devenir des octets.
  ok("clé publique : 65 octets, point non compressé",
     base64urlVersOctets("BEl4Qm9rRXhhbXBsZUtleUZvclRlc3RpbmdPbmx5MTIzNDU2Nzg5MEFCQ0RFRkdISUpLTE1OT1BRUlNUVVZXWFla").length > 60);
  ok("clé publique : le - et le _ de base64url sont rendus",
     base64urlVersOctets("_-_-")[0] === base64urlVersOctets("/+/+")[0]);
  ok("clé publique : un préfixe 0x04 reste un 0x04",
     base64urlVersOctets(btoa(String.fromCharCode(4, 1, 2)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""))[0] === 4);

  // N — aucune branche du bandeau ne peut taire l'état hôtelier.
  // L'ancre est `const bandeau` : sans elle, indexOf tombait sur l'objet etatHotels,
  // qui porte les mêmes clés — l'assertion mesurait le mauvais littéral.
  ok("les quatre branches du bandeau rappellent l'état des hôtels", (() => {
    const src = viewResults.toString();
    const dep = src.indexOf("const bandeau");
    return dep > 0 && ["\"reel\"", "\"non-configure\"", "\"erreur\"", "\"devise\""].every(cle => {
      const i = src.indexOf(cle + ":", dep);
      return i > 0 && src.slice(i, i + 900).includes("etatHotels");
    });
  })());
  const hostile = sanitizeForm({ preferences: "pas-un-tableau", pension: "__proto__", minStars: "cinq", childrenAges: null, children: 2 });
  ok("sauvegarde hostile neutralisée", Array.isArray(hostile.preferences) && hostile.pension === DEFAULTS.pension && hostile.minStars === DEFAULTS.minStars);
  ok("âges synchronisés sur le nombre d'enfants", hostile.childrenAges.length === hostile.children);

  // Tarifs réels : ils doivent remplacer le tarif modélisé, et seulement là où ils existent.
  const sansLive = priceDeal(d, base, 7, null);
  const avecLive = priceDeal(d, base, 7, { total: 999, airline: "XX" });
  ok("sans tarif réel, on garde le modèle", sansLive.priceFlight === d.flightBase * 2 && sansLive.flightReel === false);
  ok("le total Amadeus n'est PAS remultiplié", avecLive.priceFlight === 999 && avecLive.flightReel === true);
  ok("un tarif réel invalide ne casse pas le calcul",
     priceDeal(d, base, 7, { total: 0 }).priceFlight === d.flightBase * 2 &&
     priceDeal(d, base, 7, { total: "abc" }).priceFlight === d.flightBase * 2);
  const carte = search({ ...base, maxBudget: 99999 }, new Map([["LIS", { total: 150, airline: "TP" }]]))
                  .rows.find(x => x.id === "LIS");
  ok("le tarif réel n'est appliqué qu'à sa destination", carte && carte.flightReel === true &&
     search({ ...base, maxBudget: 99999 }, new Map()).rows.find(x => x.id === "LIS").flightReel === false);
  ok("tous les identifiants de séjour sont des codes IATA", DEALS.every(x => /^[A-Z]{3}$/.test(x.id)));
  ok("l'aéroport de départ est validé", sanitizeForm({ origin: "ZZZZ" }).origin === DEFAULTS.origin &&
     sanitizeForm({ origin: "LYS" }).origin === "LYS");

  // Tarif hôtelier réel : il couvre le séjour entier et toutes les chambres, donc
  // ni multiplication par les nuits, ni par les chambres, ni coefficient de pension.
  const sej = { total: 1200, nom: "Riad Réel", etoiles: 5, note: 9.2, pensionNom: "Half Board", publicAmount: 1400 };
  const avecHotel = priceDeal(d, base, 7, null, sej);
  const sansHotel = priceDeal(d, base, 7, null, null);
  ok("le tarif hôtelier réel remplace le modèle", avecHotel.priceHotel === 1200 && avecHotel.hotelReel === true);
  ok("le tarif hôtelier réel n'est pas remultiplié",
     priceDeal(d, { ...base, pension: "all-inclusive" }, 14, null, sej).priceHotel === 1200);
  ok("sans tarif hôtelier, le modèle s'applique",
     sansHotel.hotelReel === false && sansHotel.priceHotel === d.hotelRate * 7);
  ok("un tarif hôtelier invalide ne casse pas le calcul",
     priceDeal(d, base, 7, null, { total: 0 }).priceHotel === d.hotelRate * 7 &&
     priceDeal(d, base, 7, null, { total: "abc" }).priceHotel === d.hotelRate * 7);
  ok("l'établissement réel est affiché avec un tarif réel",
     avecHotel.hotelNom === "Riad Réel" && detailHotel({ ...d, ...avecHotel }) === "★★★★★ · 9.2/10 · Half Board");
  ok("sans tarif réel, on retombe sur l'hôtel de démonstration",
     avecHotel.hotelNom !== null && sansHotel.hotelNom === null &&
     detailHotel({ ...d, ...sansHotel }) === `${"★".repeat(d.stars)} · ${d.rating}/10 · 1 chambre`);
  // Tarif réel mais fiche établissement absente d'amont : le badge « hôtel réel » ne doit
  // surmonter NI le nom, NI les étoiles, NI la note du jeu de démonstration.
  const anonyme = priceDeal(d, base, 7, null, { total: 900 });
  const detailAnonyme = detailHotel({ ...d, ...anonyme });
  ok("tarif réel sans fiche hôtel : aucune donnée de démonstration sous le badge réel",
     anonyme.hotelReel === true && anonyme.hotelNom === null &&
     !detailAnonyme.includes("★") && !detailAnonyme.includes(`${d.rating}/10`) &&
     (anonyme.hotelNom || (anonyme.hotelReel ? "Établissement non communiqué" : d.hotel)) !== d.hotel);

  // « Réel » est réservé à un tarif que le voyageur peut réellement payer.
  // En bac à sable Duffel invente les prix : le badge ne doit jamais dire « réel ».
  ok("badge vol : jamais « réel » en bac à sable",
     badgeVol(true, "test").texte === "vol test" && badgeVol(true, "test").classe === "badge--test");
  ok("badge vol : « réel » seulement en mode live",
     badgeVol(true, "live").texte === "vol réel" && badgeVol(true, "live").classe === "badge--ok");
  ok("badge vol : sans tarif amont, démo quel que soit le mode",
     badgeVol(false, "test").texte === "vol démo" && badgeVol(false, "live").texte === "vol démo");
  ok("badge vol : mode inconnu ne promet pas « test »",
     badgeVol(true, null).texte === "vol réel");
  ok("note de composition : le bac à sable est dit non réservable",
     /non réservable/.test(noteComposition(true, false, 8, "test")) &&
     !/tarif réel/.test(noteComposition(true, false, 8, "test")));

  // L'animation de chargement ne doit annoncer QUE des sources réellement interrogées.
  ok("sources : aucune marque qu'on n'interroge pas",
     !/skyscanner|kayak|expedia|booking|liligo|momondo|kiwi/i.test(JSON.stringify(SOURCES)));
  ok("sources : une entrée par appel réel, ni plus ni moins",
     SOURCES.length === 3 && SOURCES.map(s => s.id).join() === "vols,hotels,modele");
  ok("nom de source : suit le fournisseur réellement retenu",
     nomSource("hotels", "liteapi") === "LiteAPI" &&
     nomSource("hotels", "duffel") === "Duffel Stays" &&
     nomSource("hotels", null) === "API hôtelière" &&
     nomSource("vols", null) === "Duffel Air");
  ok("état de source : jamais « résultats » sur une réponse vide",
     etatDepuisReponse("reel", 0) === "vide" &&
     etatDepuisReponse("reel", 3) === "ok" &&
     etatDepuisReponse("non-configure", 0) === "absent" &&
     etatDepuisReponse("erreur", 0) === "vide");
  ok("étiquette de source : singulier et pluriel",
     etiquetteSource("ok", 1).texte === "1 résultat" &&
     etiquetteSource("ok", 4).texte === "4 résultats" &&
     etiquetteSource("absent", 0).texte === "non configurée");

  // Les liens de réservation doivent viser ce que la carte AFFICHE.
  const lv = lienVols("PAR", "FAO", "2026-11-05", "2026-11-13");
  ok("lien vols : anglais, IATA, aller ET retour",
     decodeURIComponent(lv.split("?q=")[1]) === "Flights to FAO from PAR on 2026-11-05 through 2026-11-13");
  ok("lien vols : jamais de français, jamais de nom de ville",
     !/vols |Faro|Marrakech/.test(decodeURIComponent(lv)));
  ok("lien vols : dates flexibles, route seule",
     decodeURIComponent(lienVols("PAR", "RAK", "", "").split("?q=")[1]) === "Flights to RAK from PAR");
  ok("lien vols : aller simple accepté",
     decodeURIComponent(lienVols("PAR", "RAK", "2026-11-05", "").split("?q=")[1]) === "Flights to RAK from PAR on 2026-11-05");
  ok("lien hôtel : l'établissement nommé quand on le connaît",
     decodeURIComponent(lienHotel("Vila Galé", "Faro").split("?ss=")[1]) === "Vila Galé, Faro");
  ok("lien hôtel : la ville seule plutôt qu'un AUTRE hôtel",
     decodeURIComponent(lienHotel("", "Faro").split("?ss=")[1]) === "hôtels Faro");

  // Le lien doit rouvrir LE séjour affiché : mêmes dates, mêmes voyageurs, mêmes chambres.
  const sejour = { ...base, flexibleDates: false, departureDate: "2026-11-05", returnDate: "2026-11-13",
                   adults: 2, children: 1, childrenAges: [8], babies: 1, babiesAges: [10] };
  const q = new URL(lienHotel("Vila Galé", "Faro", sejour, 2)).searchParams;
  ok("lien hôtel : dates du séjour transmises",
     q.get("checkin") === "2026-11-05" && q.get("checkout") === "2026-11-13");
  ok("lien hôtel : voyageurs, âges et chambres transmis",
     q.get("group_adults") === "2" && q.get("group_children") === "2"
     && q.getAll("age").join(",") === "8,0" && q.get("no_rooms") === "2");
  ok("lien hôtel : aucune date en mode flexible",
     !new URL(lienHotel("Vila Galé", "Faro", { ...sejour, flexibleDates: true }, 1)).searchParams.has("checkin"));
  ok("lien hôtel : l'hôtel reste le premier paramètre",
     decodeURIComponent(lienHotel("Vila Galé", "Faro", sejour, 1).split("?ss=")[1].split("&")[0]) === "Vila Galé, Faro");

  // La note de bas de page ne doit jamais annoncer « démonstration » sur un tarif réel,
  // ni promettre « réel » sur un composant modélisé.
  ok("note de composition : vol réel, hôtel modélisé",
     noteComposition(true, false, 8) === "Composition du total : vol au tarif réel, tous voyageurs compris + hôtel modélisé (8 nuits × chambres × pension) + transfert estimé.");
  ok("note de composition : tout modélisé",
     /vol modélisé/.test(noteComposition(false, false, 8)) && /hôtel modélisé/.test(noteComposition(false, false, 8)));
  ok("note de composition : tout réel, plus aucun « modélisé »",
     !/modélisé/.test(noteComposition(true, true, 8)));

  // Une clé LiteAPI de bac à sable répond : le tarif existe, il n'est pas payable pour autant.
  ok("badge hôtel : démo sans tarif remonté",
     badgeHotel(false, null).texte === "hôtel démo" && badgeHotel(false, "live").texte === "hôtel démo");
  ok("badge hôtel : « test » sur une clé de bac à sable",
     badgeHotel(true, "test").texte === "hôtel test" && badgeHotel(true, "test").classe === "badge--test");
  ok("badge hôtel : « réel » réservé à la production",
     badgeHotel(true, "live").texte === "hôtel réel" && badgeHotel(true, "live").classe === "badge--ok");
  ok("note de composition : un tarif de bac à sable ne se dit jamais réel",
     /bac à sable/.test(noteComposition(true, true, 8, "live", "test"))
     && !/hôtel au tarif réel/.test(noteComposition(true, true, 8, "live", "test")));
  ok("note de composition : jamais le mot démonstration",
     [[0,0],[0,1],[1,0],[1,1]].every(([v, h]) => !/démonstration/i.test(noteComposition(!!v, !!h, 8))));
  ok("note de composition : singulier à une nuit",
     /1 nuit ×/.test(noteComposition(true, false, 1)));

  ok("vol et hôtel sont certifiés séparément",
     priceDeal(d, base, 7, { total: 500 }, null).flightReel === true &&
     priceDeal(d, base, 7, { total: 500 }, null).hotelReel === false);

  // Un badge « vol réel » ne doit jamais surmonter des horaires de démonstration.
  const offreLive = { total: 500, airline: "Transavia France", departureAt: "2026-11-05T16:20:00",
                      returnAt: "2026-11-13T18:30:00", transfers: 0 };
  const cLive = priceDeal(d, base, 7, offreLive);
  ok("compagnie réelle affichée avec un tarif réel", cLive.compagnieReelle === "Transavia France");
  ok("horaires réels affichés avec un tarif réel",
     horaireVol({ ...d, ...cLive }) === "départ 16:20 · retour 18:30 · direct");
  const cDemo = priceDeal(d, base, 7, null);
  ok("sans tarif réel, on retombe sur les horaires de démonstration",
     cDemo.compagnieReelle === null && horaireVol({ ...d, ...cDemo }) === d.times);
  ok("un tarif réel sans horaire ne casse pas l'affichage",
     horaireVol({ ...d, ...priceDeal(d, base, 7, { total: 500, airline: "X" }) }) === d.times);

  // Les clés de prix ne doivent jamais écraser les champs du séjour lors de la fusion
  // (une clé `hotel` numérique avait remplacé le nom de l'hôtel sur les cartes).
  const merged = search({ ...base, maxBudget: 99999 }).rows.find(r => r.id === "LIS");
  ok("le nom d'hôtel survit à la fusion", merged && merged.hotel === d.hotel);
  ok("les montants restent numériques", merged && [merged.priceFlight, merged.priceHotel, merged.priceExtra, merged.total].every(Number.isFinite));
}
window.selfCheck = selfCheck;

/* ==================== BOOT ==================== */
state.formData.departureDate = addDays(today(), 45);
state.formData.returnDate = addDays(state.formData.departureDate, state.formData.tripDuration);
render();

if (new URLSearchParams(location.search).has("selftest")) {
  const r = selfCheck();
  document.body.insertAdjacentHTML("afterbegin",
    `<pre style="position:fixed;inset:auto 8px 8px auto;z-index:99;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:12px;box-shadow:var(--shadow-3)">${esc(r.lines.join("\n"))}\n\n${r.failed ? "❌ " + r.failed + " échec(s)" : "✅ " + r.total + "/" + r.total + " OK"}</pre>`);
}

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
