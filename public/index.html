<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Travel Deal Hunter — compare vol + hôtel + transfert et trouve le meilleur rapport qualité/prix pour toute la famille.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3b4fd8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1018" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Travel Deal">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%233b4fd8' width='192' height='192' rx='40'/><text x='96' y='104' font-size='110' text-anchor='middle' dominant-baseline='central'>✈️</text></svg>">
<title>Travel Deal Hunter</title>
<style>
/* ============ TOKENS ============ */
:root {
  --bg:          #f5f7fc;
  --bg-tint:     #eef1fa;
  --surface:     #ffffff;
  --surface-2:   #f2f4fa;
  --border:      #e1e6f2;
  --border-strong:#cdd5e8;
  --text:        #131a2b;
  --muted:       #5b6579;
  --faint:       #687083;
  --primary:     #3b4fd8;
  --primary-ink: #2b3bb0;
  --primary-soft:#e7eaff;
  --accent:      #ef5f22;
  --accent-ink:  #b23e0d;  /* texte accent sur fond clair : #ef5f22 ne donnait que 2.84:1 */
  --accent-soft: #ffe9dd;
  --success:     #0d7a54;
  --success-soft:#dff4ea;
  --danger:      #c22a20;
  --danger-soft: #fde8e6;
  --gold:        #c99700;

  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-full: 999px;
  --sp: 0.25rem;
  --shadow-1: 0 1px 2px rgba(17,24,45,.06), 0 1px 3px rgba(17,24,45,.05);
  --shadow-2: 0 4px 12px rgba(17,24,45,.07), 0 2px 4px rgba(17,24,45,.04);
  --shadow-3: 0 18px 40px -16px rgba(17,24,45,.25);
  --ring: 0 0 0 3px color-mix(in srgb, var(--primary) 28%, transparent);
  --ease: cubic-bezier(.2,.7,.3,1);
}
/* Pas de nesting CSS ici : la forme @media > :root reste lisible par Safari 15. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0b0f17; --bg-tint:#111726; --surface:#141a26; --surface-2:#1b2331;
    --border:#252f41; --border-strong:#33405a;
    --text:#e9edf6; --muted:#9aa4b8; --faint:#828ca4;
    --primary:#7d8cff; --primary-ink:#9aa5ff; --primary-soft:#1d2440;
    --accent:#ff8149; --accent-ink:#ff8149; --accent-soft:#33200f;
    --success:#37c08b; --success-soft:#11291f;
    --danger:#ff6b5e; --danger-soft:#2c1512;
    --gold:#e2b93b;
    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 6px 16px rgba(0,0,0,.45);
    --shadow-3: 0 18px 40px -16px rgba(0,0,0,.7);
  }
}
[data-theme="dark"] {
  --bg:#0b0f17; --bg-tint:#111726; --surface:#141a26; --surface-2:#1b2331;
  --border:#252f41; --border-strong:#33405a;
  --text:#e9edf6; --muted:#9aa4b8; --faint:#828ca4;
  --primary:#7d8cff; --primary-ink:#9aa5ff; --primary-soft:#1d2440;
  --accent:#ff8149; --accent-ink:#ff8149; --accent-soft:#33200f;
  --success:#37c08b; --success-soft:#11291f;
  --danger:#ff6b5e; --danger-soft:#2c1512;
  --gold:#e2b93b;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 6px 16px rgba(0,0,0,.45);
  --shadow-3: 0 18px 40px -16px rgba(0,0,0,.7);
}

/* ============ BASE ============ */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
body {
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: calc(5.5rem + env(safe-area-inset-bottom));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto 0; height: 420px; z-index: -1; pointer-events: none;
  background:
    radial-gradient(70% 90% at 12% -10%, color-mix(in srgb, var(--primary) 20%, transparent), transparent 62%),
    radial-gradient(60% 80% at 92% -20%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%);
}
h1, h2, h3 { line-height: 1.2; letter-spacing: -.02em; font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:where(a, button, input, select, [tabindex]):focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--r-sm);
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.num { font-variant-numeric: tabular-nums; }

/* ============ SHELL ============ */
.shell { max-width: 1140px; margin-inline: auto; padding-inline: clamp(1rem, 4vw, 2rem); }

.appbar {
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: saturate(180%) blur(14px);
  background: var(--bg); /* fallback si color-mix() n'est pas supporté */
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom: 1px solid transparent;
  transition: border-color .2s var(--ease), background .2s var(--ease);
  padding-top: env(safe-area-inset-top);
}
.appbar.is-stuck { border-bottom-color: var(--border); background: var(--bg); background: color-mix(in srgb, var(--bg) 94%, transparent); }
.appbar__in { display: flex; align-items: center; gap: .75rem; height: 60px; }
.brand { display: flex; align-items: center; gap: .55rem; font-weight: 750; letter-spacing: -.02em; font-size: 1.05rem; }
.brand__mark {
  width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px;
  background: var(--primary);
  background: linear-gradient(140deg, var(--primary), color-mix(in srgb, var(--accent) 65%, var(--primary)));
  font-size: 1rem; box-shadow: var(--shadow-1);
}
.appbar__spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; display: grid; place-items: center;
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
  box-shadow: var(--shadow-1); font-size: 1rem;
  transition: transform .15s var(--ease), border-color .15s var(--ease);
}
.icon-btn:hover { border-color: var(--border-strong); transform: translateY(-1px); }

/* ============ HERO ============ */
.hero { padding: clamp(1.5rem, 5vw, 2.75rem) 0 1.25rem; }
.hero h1 { font-size: clamp(1.75rem, 5.5vw, 2.6rem); }
.hero p { color: var(--muted); margin-top: .5rem; max-width: 48ch; font-size: clamp(.95rem, 2.5vw, 1.05rem); }
.eyebrow {
  display: inline-flex; align-items: center; gap: .4rem; margin-bottom: .75rem;
  padding: .28rem .7rem; border-radius: var(--r-full);
  background: var(--accent-soft); color: var(--accent-ink);
  font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
}
.hero__stats { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 1.25rem; }
.stat__n { font-size: 1.3rem; font-weight: 750; letter-spacing: -.02em; }
.stat__l { font-size: .78rem; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }

/* ============ CARDS / GRID ============ */
/* Cartes étirées à la hauteur de leur ligne : les creux sous les cartes courtes
   deviennent de la marge intérieure au lieu de trous entre les cartes.
   (Un layout en colonnes tasserait mieux, mais casserait l'ordre de lecture.) */
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: stretch; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 1.25rem; box-shadow: var(--shadow-1);
}
.card--wide { grid-column: 1 / -1; }
.card__head { display: flex; align-items: center; gap: .55rem; margin-bottom: 1rem; }
.card__ico {
  width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 9px;
  background: var(--surface-2); font-size: .95rem;
}
.card__title { font-size: 1rem; font-weight: 700; letter-spacing: -.01em; }
.card__hint { margin-left: auto; font-size: .75rem; color: var(--faint); font-weight: 600; }

/* ============ FORM ============ */
.field { margin-bottom: .9rem; }
.field:last-child { margin-bottom: 0; }
.field > label, .field-label {
  display: block; font-size: .8rem; font-weight: 650; color: var(--muted);
  margin-bottom: .35rem; letter-spacing: .01em;
}
.input, select.input {
  width: 100%; padding: .62rem .75rem;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: var(--r-md);
  font-size: .95rem; transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
}
select.input {
  appearance: none; padding-right: 2.1rem;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
.input:focus { outline: none; border-color: var(--primary); box-shadow: var(--ring); }
.input:invalid:not(:placeholder-shown) { border-color: var(--danger); }
.hint { display: block; margin-top: .3rem; font-size: .75rem; color: var(--faint); }
.hint--err { color: var(--danger); font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
/* Les trois compteurs côte à côte : la carte Voyageurs ne fait plus le double
   de hauteur des autres cartes de la même ligne. */
.pax { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
.pax .field { margin-bottom: .9rem; }
.pax .stepper button { width: 32px; height: 34px; font-size: 1rem; }
.pax .stepper .input { padding: .5rem .25rem; }
@media (max-width: 520px) { .pax { grid-template-columns: 1fr; } }

/* stepper */
.stepper { display: flex; align-items: center; gap: .4rem; }
.stepper .input { text-align: center; flex: 1; min-width: 3ch; padding-inline: .2rem; }
/* Les flèches natives mangeaient toute la largeur du champ quand les trois compteurs
   passent côte à côte : les boutons − / + font déjà le travail. */
.stepper .input::-webkit-outer-spin-button,
.stepper .input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper .input { -moz-appearance: textfield; appearance: textfield; }
.stepper button {
  width: 38px; height: 38px; flex: none; border-radius: var(--r-md);
  border: 1px solid var(--border-strong); background: var(--surface-2);
  font-size: 1.1rem; line-height: 1; font-weight: 600; color: var(--muted);
  transition: background .15s var(--ease), color .15s var(--ease);
}
.stepper button:hover:not(:disabled) { background: var(--primary-soft); color: var(--primary); }
.stepper button:disabled { opacity: .4; cursor: not-allowed; }

/* chips / segmented */
.chips { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip {
  padding: .45rem .8rem; border-radius: var(--r-full);
  border: 1px solid var(--border-strong); background: var(--surface);
  font-size: .85rem; font-weight: 600; color: var(--muted);
  transition: all .15s var(--ease);
}
.chip:hover { border-color: var(--primary); color: var(--primary); }
.chip[aria-pressed="true"] {
  background: var(--primary); border-color: var(--primary); color: #fff;
  box-shadow: 0 2px 8px color-mix(in srgb, var(--primary) 35%, transparent);
}
.seg {
  display: flex; gap: .25rem; padding: .25rem;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md);
}
.seg button {
  flex: 1; padding: .48rem .6rem; border: 0; border-radius: 9px; background: transparent;
  font-size: .86rem; font-weight: 650; color: var(--muted); transition: all .15s var(--ease);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }

/* checkbox */
.check { display: flex; align-items: flex-start; gap: .6rem; cursor: pointer; font-size: .9rem; }
.check input { width: 18px; height: 18px; margin-top: 2px; flex: none; accent-color: var(--primary); cursor: pointer; }
.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: .4rem; }
.month {
  padding: .45rem .3rem; border-radius: var(--r-md); border: 1px solid var(--border-strong);
  background: var(--surface); font-size: .8rem; font-weight: 600; color: var(--muted);
  transition: all .15s var(--ease);
}
.month:hover { border-color: var(--primary); }
.month[aria-checked="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-ink); }

/* range */
.range-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .3rem; }
.range-val { font-size: 1.15rem; font-weight: 750; letter-spacing: -.02em; }
input[type=range] { width: 100%; accent-color: var(--primary); height: 24px; cursor: pointer; }

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  padding: .7rem 1.1rem; border: 1px solid transparent; border-radius: var(--r-md);
  font-size: .92rem; font-weight: 650; transition: transform .12s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease);
}
.btn:active { transform: scale(.985); }
.btn--primary { background: var(--primary); color: #fff; box-shadow: 0 3px 10px color-mix(in srgb, var(--primary) 32%, transparent); }
.btn--primary:hover { background: var(--primary-ink); }
.btn--ghost { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
.btn--ghost:hover { border-color: var(--primary); color: var(--primary); }
.btn--hunt {
  width: 100%; padding: .85rem 1.2rem; font-size: 1rem; color: #fff;
  background: var(--accent);
  background: linear-gradient(120deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--primary)));
  box-shadow: 0 6px 18px -4px color-mix(in srgb, var(--accent) 55%, transparent);
}
.btn--hunt:hover { filter: brightness(1.06); }
.btn--hunt:disabled { opacity: .55; cursor: progress; }

.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  padding: .75rem clamp(1rem, 4vw, 2rem) calc(.75rem + env(safe-area-inset-bottom));
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  border-top: 1px solid var(--border);
}
.actionbar__in { max-width: 1140px; margin-inline: auto; display: flex; gap: .6rem; align-items: center; }
.actionbar .btn--hunt { flex: 2; }
.actionbar .btn--ghost { flex: 0 0 auto; }

/* ============ ALERT ============ */
.alert {
  display: flex; gap: .6rem; align-items: flex-start;
  padding: .75rem .9rem; border-radius: var(--r-md); font-size: .88rem;
  border: 1px solid transparent; margin-bottom: 1rem;
}
.alert--info { background: var(--primary-soft); border-color: var(--primary); border-color: color-mix(in srgb, var(--primary) 25%, transparent); color: var(--primary-ink); }
.alert--warn { background: var(--accent-soft);  border-color: var(--accent);  border-color: color-mix(in srgb, var(--accent) 30%, transparent);  color: var(--accent-ink); }
.alert--err  { background: var(--danger-soft);  border-color: var(--danger);  border-color: color-mix(in srgb, var(--danger) 30%, transparent);  color: var(--danger); }

/* ============ RESULTS ============ */
.results-head { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin: 1.25rem 0 1rem; }
.results-head h2 { font-size: 1.35rem; }
.results-head .count { color: var(--muted); font-size: .9rem; }
.sortbar { margin-left: auto; display: flex; gap: .35rem; }

.deals { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
.deal {
  position: relative; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 1.15rem; box-shadow: var(--shadow-1); overflow: hidden;
  transition: transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
}
.deal:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--border-strong); }
.deal--best { border-color: var(--gold); box-shadow: var(--shadow-2); }
.deal--best::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
  background: linear-gradient(90deg, var(--gold), var(--accent));
}
.deal__top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: .9rem; }
.deal__rank { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.medal { font-size: 1.35rem; line-height: 1; }
.deal__dest { font-size: 1.08rem; font-weight: 700; letter-spacing: -.015em; }
.deal__sub { font-size: .8rem; color: var(--faint); margin-top: .1rem; }
.deal__price { text-align: right; flex: none; }
.deal__total { font-size: 1.75rem; font-weight: 780; letter-spacing: -.03em; color: var(--accent); line-height: 1; }
.deal__per { font-size: .74rem; color: var(--faint); margin-top: .2rem; }

.badge {
  display: inline-flex; align-items: center; gap: .25rem;
  padding: .18rem .5rem; border-radius: var(--r-full);
  font-size: .68rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
}
.badge--demo { background: var(--surface-2); color: var(--faint); }
.badge--ok   { background: var(--success-soft); color: var(--success); }
.badge--eu   { background: var(--primary-soft); color: var(--primary-ink); }
.badge--test { background: var(--accent-soft); color: var(--accent-ink); }

.specs { display: grid; gap: .55rem; padding: .85rem 0; border-block: 1px solid var(--border); }
.spec { display: grid; grid-template-columns: 22px 1fr auto; gap: .55rem; align-items: baseline; font-size: .87rem; }
.spec__k { color: var(--muted); }
.spec__v { text-align: right; font-weight: 600; }
.spec__v small { display: block; font-weight: 400; color: var(--faint); font-size: .76rem; }

.bar { display: flex; height: 7px; border-radius: var(--r-full); overflow: hidden; margin: .8rem 0 .45rem; background: var(--surface-2); }
.bar > i { display: block; }
.bar__flight { background: var(--primary); }
.bar__hotel  { background: var(--accent); }
.bar__extra  { background: var(--success); }
.legend { display: flex; flex-wrap: wrap; gap: .75rem; font-size: .75rem; color: var(--muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: .3rem; }

.deal__cta { display: flex; gap: .5rem; margin-top: .9rem; }
.deal__cta .btn { flex: 1; padding: .58rem .7rem; font-size: .84rem; }

/* skeleton */
.skeleton { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 1.15rem; }
.sk { background: linear-gradient(90deg, var(--surface-2) 25%, var(--bg-tint) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: sk 1.3s infinite linear; border-radius: 6px; }
@keyframes sk { to { background-position: -200% 0; } }

/* Sources interrogées, affichées pendant la chasse. */
.srcs { display: grid; gap: .55rem; margin: 1.25rem 0 1.5rem; }
.src { display: flex; align-items: center; gap: .8rem; padding: .7rem .9rem;
       background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); }
.src__mono { width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto;
             display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .95rem; }
.src__txt { flex: 1 1 auto; min-width: 0; line-height: 1.25; }
.src__nom { font-weight: 600; font-size: .92rem; }
.src__couvre { color: var(--muted); font-size: .78rem; }
.src__etat { font-size: .78rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.src--attente .src__etat { color: var(--faint); }
.src--encours .src__etat { color: var(--primary-ink); }
.src--ok      .src__etat { color: var(--success); font-weight: 600; }
.src--vide    .src__etat,
.src--absent  .src__etat { color: var(--muted); }
.src--attente .src__mono { opacity: .4; }
.src--encours .src__mono { animation: srcPulse 1.1s ease-in-out infinite; }
@keyframes srcPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(.9); } }
@media (prefers-reduced-motion: reduce) {
  .src--encours .src__mono { animation: none; }
  .sk { animation: none; }
}

.empty { text-align: center; padding: 3rem 1rem; }
.empty__ico { font-size: 2.5rem; }
.empty h3 { margin: .75rem 0 .35rem; font-size: 1.1rem; }
.empty p { color: var(--muted); font-size: .9rem; max-width: 42ch; margin-inline: auto; }

/* ============ DIALOG ============ */
dialog {
  border: 1px solid var(--border); border-radius: var(--r-lg); padding: 0;
  background: var(--surface); color: var(--text); box-shadow: var(--shadow-3);
  width: min(440px, calc(100vw - 2rem)); max-height: 80dvh;
}

<!-- Région d'annonce dédiée. `aria-live` était posé sur #app, dont le contenu est
     RÉÉCRIT EN ENTIER à chaque rendu : un lecteur d'écran réannonçait toute la page au
     moindre clic sur un compteur. Ici, une phrase, et seulement quand elle change. -->

  </div>

</dialog>

<script>
"use strict";

/* ==================== UTIL ==================== */
const ESC_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
/** Escape every interpolation that reaches innerHTML. Fixes the stored-XSS in the original. */
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ESC_MAP[c]);
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const int = (v, dflt = 0) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : dflt; };
const num = (v, dflt = 0) => { const n = parseFloat(String(v).replace(",", ".")); return Number.isFinite(n) ? n : dflt; };
const eur = n => Math.round(n).toLocaleString("fr-FR") + " €";
/* Au maximum, le curseur n'est plus une limite : il l'annonce au lieu d'afficher « 50 km ». */
const libellePlage = km => km >= PLAGE_LIBRE ? "sans limite" : `${km} km max`;
const MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (iso, d) => { const t = new Date(iso + "T12:00:00"); t.setDate(t.getDate() + d); return t.toISOString().slice(0, 10); };
const nightsBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);

/* ==================== DATA (démo) ==================== */
/* hotelRate = prix chambre / nuit en petit-déjeuner ; flightBase = prix adulte A/R */
const DEALS = [
  { id:"RAK", city:"Marrakech", country:"Maroc", schengen:false, airline:"Air France",  times:"08:15 → 10:30", hotel:"Riad Palais Salam",   stars:4, rating:8.7, flightBase:325, hotelRate:120, transferMin:35, transfer:80,  beachKm:180, family:true,  lat:31.6295, lon:-7.9811, tags:["chaleur","beaux-paysages","rapport-qualite-prix"] },
  { id:"ESU", city:"Essaouira", country:"Maroc", schengen:false, airline:"Ryanair",     times:"10:00 → 12:15", hotel:"Les Jardins de Tanjia",stars:4, rating:8.5, flightBase:290, hotelRate:115, transferMin:25, transfer:80,  beachKm:1,   family:true,  lat:31.5085, lon:-9.7595, tags:["plage","chaleur","peu-touristique","rapport-qualite-prix"] },
  { id:"TFS", city:"Ténérife",  country:"Canaries", schengen:true, airline:"EasyJet",   times:"09:30 → 13:45", hotel:"Club Med Magma",      stars:4, rating:8.4, flightBase:360, hotelRate:130, transferMin:45, transfer:100, beachKm:0.3, family:true,  lat:28.05, lon:-16.7167, tags:["plage","chaleur","beaux-paysages"] },
  { id:"AGA", city:"Agadir",    country:"Maroc", schengen:false, airline:"Royal Air Maroc", times:"07:45 → 10:50", hotel:"Sofitel Thalassa",stars:5, rating:8.9, flightBase:295, hotelRate:138, transferMin:20, transfer:80,  beachKm:0.2, family:true,  lat:30.4278, lon:-9.5981, tags:["plage","chaleur","rapport-qualite-prix"] },
  { id:"CHQ", city:"La Canée",  country:"Crète", schengen:true, airline:"Aegean",       times:"11:00 → 15:30", hotel:"Doma Boutique",       stars:4, rating:8.6, flightBase:355, hotelRate:135, transferMin:30, transfer:90,  beachKm:2,   family:false, lat:35.5138, lon:24.018, tags:["plage","beaux-paysages","peu-touristique"] },
  { id:"LIS", city:"Lisbonne",  country:"Portugal", schengen:true, airline:"TAP Air",   times:"09:00 → 11:20", hotel:"Memmo Alfama",        stars:4, rating:8.8, flightBase:210, hotelRate:110, transferMin:25, transfer:60,  beachKm:22,  family:false, lat:38.7223, lon:-9.1393, tags:["beaux-paysages","rapport-qualite-prix"] },
  { id:"BCN", city:"Barcelone", country:"Espagne", schengen:true, airline:"Vueling",    times:"10:30 → 12:20", hotel:"W Barcelona",         stars:5, rating:8.7, flightBase:240, hotelRate:140, transferMin:30, transfer:70,  beachKm:0.1, family:true,  lat:41.3851, lon:2.1734, tags:["plage","beaux-paysages"] },
  { id:"FAO", city:"Faro",      country:"Portugal", schengen:true, airline:"Transavia", times:"06:40 → 08:45", hotel:"Vila Galé Albacora",  stars:4, rating:8.3, flightBase:195, hotelRate:98,  transferMin:35, transfer:65,  beachKm:1.5, family:true,  lat:37.0194, lon:-7.9304, tags:["plage","chaleur","peu-touristique","rapport-qualite-prix"] },
  { id:"DJE", city:"Djerba",    country:"Tunisie", schengen:false, airline:"Nouvelair", times:"12:10 → 14:35", hotel:"Radisson Blu Palace", stars:5, rating:8.5, flightBase:265, hotelRate:105, transferMin:20, transfer:55,  beachKm:0.1, family:true,  lat:33.8076, lon:10.8451, tags:["plage","chaleur","rapport-qualite-prix","peu-touristique"] },
  { id:"PMI", city:"Palma",     country:"Baléares", schengen:true, airline:"Volotea",   times:"14:20 → 16:05", hotel:"Iberostar Playa",     stars:4, rating:8.2, flightBase:225, hotelRate:125, transferMin:25, transfer:70,  beachKm:0.2, family:true,  lat:39.5696, lon:2.6502, tags:["plage","chaleur","beaux-paysages"] }
];

const PENSIONS = {
  "petit-dej":     { label: "Petit-déjeuner",    mult: 1.00 },
  "demi-pension":  { label: "Demi-pension",      mult: 1.16 },
  "complet":       { label: "Pension complète",  mult: 1.30 },
  "all-inclusive": { label: "All-inclusive",     mult: 1.48 }
};
const AIRPORTS = [
  { code: "PAR", label: "Paris — tous aéroports" },
  { code: "LYS", label: "Lyon Saint-Exupéry" },
  { code: "MRS", label: "Marseille Provence" },
  { code: "NCE", label: "Nice Côte d'Azur" },
  { code: "TLS", label: "Toulouse Blagnac" },
  { code: "BOD", label: "Bordeaux Mérignac" },
  { code: "NTE", label: "Nantes Atlantique" },
  { code: "LIL", label: "Lille Lesquin" }
];

const PREFS = [
  { id:"plage",                label:"🏖️ Plage" },
  { id:"chaleur",              label:"☀️ Chaleur" },
  { id:"beaux-paysages",       label:"🏞️ Beaux paysages" },
  { id:"peu-touristique",      label:"🤫 Peu touristique" },
  { id:"rapport-qualite-prix", label:"💶 Bon rapport" }
];

/* ==================== STATE ==================== */

/* Distance à la plage : au-delà de ce curseur, le filtre est désactivé plutôt que
 * de plafonner. Le jeu de séjours va jusqu'à 180 km (Marrakech) ; sans cette
 * échappatoire, un curseur borné à 50 km écarterait définitivement l'intérieur des
 * terres. C'est aussi la valeur par défaut : le filtre existe, mais n'écarte rien
 * tant que l'utilisateur ne l'a pas bougé — les résultats d'avant ne changent pas. */
const PLAGE_LIBRE = 50;

/* Horizon de vente, en jours. Même valeur que HORIZON_JOURS dans netlify/lib/duffel.mjs :
 * au-delà, les deux proxys refusent en 400 plutôt que de gaspiller douze appels amont.
 * La page le dit AVANT l'appel — un champ borné vaut mieux qu'un refus après 15 s. */
const HORIZON_JOURS = 400;
const dernierJour = () => addDays(today(), HORIZON_JOURS);

const DEFAULTS = Object.freeze({
  origin: "PAR",
  adults: 2, children: 1, childrenAges: [3], babies: 1, babiesAges: [10],
  flexibleDates: false, departureDate: "", returnDate: "",
  selectedMonths: [4], tripDuration: 8,   // un seul mois : c'est le seul qui soit interrogé
  destinationType: "flexible", destinations: [],
  schengenOnly: false, maxBudget: 2500,
  minStars: 4, minRating: 7.5, pension: "demi-pension",
  maxTransfer: 60, maxBeachDistance: PLAGE_LIBRE, familyHotel: true, bagageSoute: false,
  // null = peu importe. Le départ est jugé au décollage, le retour à l'atterrissage.
  departApres: null, retourAvant: null,
  preferences: ["plage", "chaleur", "beaux-paysages", "peu-touristique", "rapport-qualite-prix"]
});

const state = {
  view: "form",
  loading: false,
  error: null,
  sort: "price",
  live: null,          // Map code IATA -> tarif réel, ou null
  liveStatus: null,    // "reel" | "non-configure" | "erreur" | "devise"
  liveMode: null,      // "test" (bac à sable Duffel) | "live"
  stays: null,         // Map code -> tarif hôtelier réel, ou null
  staysStatus: null,   // "reel" | "non-configure" | "erreur"
  staysFournisseur: null,   // "liteapi" | "duffel"
  staysMode: null,     // "test" (clé sand_ LiteAPI ou jeton duffel_test_) | "live"
  veilles: null,       // résumés rendus par /api/veille, null tant qu'on n'a pas demandé
  alertes: null,       // "actives" | "inactives" | "refusees" | "indisponibles"
  veilleMsg: null,     // retour de la dernière action de veille, affiché tel quel
  sources: {},         // id -> "attente" | "encours" | "ok" | "vide" | "absent"
  sourcesN: {},        // id -> nombre de résultats réellement revenus
  results: [],
  formData: structuredClone(DEFAULTS)
};

/* Merge an untrusted saved object onto the defaults: missing keys can no longer crash
   `.includes` / `.join`, and unknown keys are dropped. */
function sanitizeForm(raw) {
  const f = structuredClone(DEFAULTS);
  if (!raw || typeof raw !== "object") return f;
  f.origin        = AIRPORTS.some(a => a.code === raw.origin) ? raw.origin : f.origin;
  f.adults        = clamp(int(raw.adults, f.adults), 1, 9);
  f.children      = clamp(int(raw.children, f.children), 0, 6);
  f.babies        = clamp(int(raw.babies, f.babies), 0, 4);
  f.childrenAges  = Array.isArray(raw.childrenAges) ? raw.childrenAges.map(a => clamp(int(a, 3), 0, 17)) : f.childrenAges;
  f.babiesAges    = Array.isArray(raw.babiesAges) ? raw.babiesAges.map(a => clamp(int(a, 12), 0, 23)) : f.babiesAges;
  f.flexibleDates = !!raw.flexibleDates;
  f.departureDate = /^\d{4}-\d{2}-\d{2}$/.test(raw.departureDate) ? raw.departureDate : "";
  f.returnDate    = /^\d{4}-\d{2}-\d{2}$/.test(raw.returnDate) ? raw.returnDate : "";
  // Un seul mois est conservé : c'est le seul que la chasse interroge. Une recherche
  // sauvegardée avant le 2026-09-22 peut en porter plusieurs — on garde le premier,
  // exactement celui que `datesEffectives()` utilisait déjà en silence.
  f.selectedMonths= Array.isArray(raw.selectedMonths)
    ? raw.selectedMonths.map(m => int(m, 0)).filter(m => m >= 1 && m <= 12).slice(0, 1)
    : f.selectedMonths;
  f.tripDuration  = clamp(int(raw.tripDuration, f.tripDuration), 2, 28);
  f.destinationType = raw.destinationType === "specific" ? "specific" : "flexible";
  f.destinations  = Array.isArray(raw.destinations) ? raw.destinations.filter(id => DEALS.some(d => d.id === id)) : [];
  f.schengenOnly  = !!raw.schengenOnly;
  f.maxBudget     = clamp(int(raw.maxBudget, f.maxBudget), 300, 30000);
  f.minStars      = clamp(int(raw.minStars, f.minStars), 3, 5);
  f.minRating     = clamp(num(raw.minRating, f.minRating), 0, 10);
  f.pension       = Object.hasOwn(PENSIONS, raw.pension) ? raw.pension : f.pension;
  f.maxTransfer   = clamp(int(raw.maxTransfer, f.maxTransfer), 10, 240);
  f.maxBeachDistance = clamp(int(raw.maxBeachDistance, f.maxBeachDistance), 1, PLAGE_LIBRE);
  f.familyHotel   = raw.familyHotel !== false;
  f.bagageSoute   = raw.bagageSoute === true;
  const heure = v => { const h = int(v, -1); return h >= 0 && h <= 23 ? h : null; };
  f.departApres   = raw.departApres === null || raw.departApres === undefined ? null : heure(raw.departApres);
  f.retourAvant   = raw.retourAvant === null || raw.retourAvant === undefined ? null : heure(raw.retourAvant);
  f.preferences   = Array.isArray(raw.preferences) ? raw.preferences.filter(p => PREFS.some(x => x.id === p)) : f.preferences;
  syncAges(f);
  return f;
}

/* childrenAges / babiesAges must always match the declared counts. */
function syncAges(f) {
  while (f.childrenAges.length < f.children) f.childrenAges.push(6);
  f.childrenAges.length = f.children;
  while (f.babiesAges.length < f.babies) f.babiesAges.push(12);
  f.babiesAges.length = f.babies;
}

/* ==================== PRICING + SEARCH ==================== */
/** Prix complet d'un deal pour une composition familiale donnée. Testé par selfCheck(). */
function priceDeal(deal, f, nights, live, sejour) {
  const kids = f.children, babies = f.babies;
  // Amadeus renvoie un total POUR TOUS LES VOYAGEURS (il reçoit adults/children/
  // infants) : on le prend tel quel. Sans tarif réel on retombe sur le modèle, qui
  // lui raisonne par adulte et doit donc être multiplié.
  const reel = live && Number.isFinite(live.total) && live.total > 0 ? live.total : null;
  const flight = reel !== null ? reel : deal.flightBase * (f.adults + kids * 0.75) + babies * 35;
  // Même règle que chambres() dans netlify/functions/stays.mjs : 3 couchages par chambre,
  // mais jamais plus de chambres que d'adultes — une chambre sans adulte n'est pas
  // réservable. Les deux formules DOIVENT rester identiques : le tarif hôtelier réel est
  // multiplié par le nombre de chambres calculé côté fonction, et affiché ici.
  const rooms  = Math.max(1, Math.min(f.adults, Math.ceil((f.adults + kids) / 3)));
  // Le tarif hôtelier réel couvre déjà le séjour entier et toutes les chambres :
  // ni multiplication par les nuits, ni par les chambres, ni coefficient de pension.
  const hotelReel = sejour && Number.isFinite(sejour.total) && sejour.total > 0 ? sejour.total : null;
  const hotel  = hotelReel !== null ? hotelReel : deal.hotelRate * nights * rooms * PENSIONS[f.pension].mult;
  const extra  = deal.transfer * rooms;
  const total  = flight + hotel + extra;
  return {
    priceFlight: Math.round(flight),
    priceHotel: Math.round(hotel),
    priceExtra: Math.round(extra),
    total: Math.round(total),
    rooms, nights,
    flightReel: reel !== null,
    hotelReel: hotelReel !== null,
    hotelNom: hotelReel !== null && sejour.nom ? sejour.nom : null,
    hotelEtoiles: hotelReel !== null && Number.isFinite(sejour.etoiles) ? sejour.etoiles : null,
    hotelNote: hotelReel !== null && Number.isFinite(sejour.note) ? sejour.note : null,
    hotelPension: hotelReel !== null ? sejour.pensionNom : null,
    hotelPublic: hotelReel !== null ? sejour.publicAmount : null,
    // Quand le tarif est réel, la compagnie et les horaires doivent l'être aussi :
    // afficher un badge « vol réel » au-dessus des horaires de démonstration serait
    // un mensonge d'affichage.
    compagnieReelle: reel !== null && live.airline ? live.airline : null,
    departReel: reel !== null ? live.departureAt : null,
    retourReel: reel !== null ? live.returnAt : null,
    escalesReelles: reel !== null && Number.isFinite(live.transfers) ? live.transfers : null,
    arriveeRetourReel: reel !== null ? (live.arriveeRetourAt || null) : null,
    // Bagages inclus par le tarif réellement retenu. `null` quand l'amont n'a rien
    // déclaré : la carte dira « non communiqués » plutôt que d'inventer une absence.
    bagagesReels: reel !== null && live.bagages ? live.bagages : null
  };
}

function matchScore(deal, f) {
  let s = 0;
  for (const p of f.preferences) if (deal.tags.includes(p)) s += 2;
  if (f.familyHotel && deal.family) s += 1;
  s += (deal.rating - 7) * 1.5;
  return Math.round(s * 10) / 10;
}

/** Applique TOUS les filtres du formulaire. L'original n'en appliquait aucun sauf Schengen. */
function search(f, live, stays) {
  // Garde-fou : des dates vides ou invalides donnaient un nombre de nuits NaN,
  // donc des totaux NaN, donc un filtre budget qui laissait tout passer.
  const raw = f.flexibleDates ? f.tripDuration : nightsBetween(f.departureDate, f.returnDate);
  const nights = Number.isFinite(raw) && raw > 0
    ? clamp(raw, 1, 60)
    : clamp(int(f.tripDuration, DEFAULTS.tripDuration), 1, 60);

  const rejected = { stars: 0, rating: 0, schengen: 0, transfer: 0, beach: 0, budget: 0, dest: 0, family: 0 };
  const kept = [];

  for (const d of DEALS) {
    if (f.destinationType === "specific" && f.destinations.length && !f.destinations.includes(d.id)) { rejected.dest++; continue; }
    if (f.schengenOnly && !d.schengen) { rejected.schengen++; continue; }
    if (d.stars < f.minStars) { rejected.stars++; continue; }
    if (d.rating < f.minRating) { rejected.rating++; continue; }
    if (d.transferMin > f.maxTransfer) { rejected.transfer++; continue; }
    // beachKm vient du jeu de séjours, jamais d'une API : la distance reste modélisée,
    // même quand le prix de l'hôtel est réel. Le libellé du curseur le dit.
    if (f.maxBeachDistance < PLAGE_LIBRE && d.beachKm > f.maxBeachDistance) { rejected.beach++; continue; }
    if (f.familyHotel && !d.family) { rejected.family++; continue; }
    const p = priceDeal(d, f, nights, live && live.get ? live.get(d.id) : null, stays && stays.get ? stays.get(d.id) : null);
    if (p.total > f.maxBudget) { rejected.budget++; continue; }
    kept.push({ ...d, ...p, score: matchScore(d, f) });
  }
  return { rows: kept, nights, rejected };
}

function sortRows(rows, mode) {
  const c = rows.slice();
  if (mode === "score")  c.sort((a, b) => b.score - a.score || a.total - b.total);
  else if (mode === "rating") c.sort((a, b) => b.rating - a.rating || a.total - b.total);
  else c.sort((a, b) => a.total - b.total);
  return c;
}

function topReason(rejected) {
  const labels = {
    budget: "ton budget max", stars: "le nombre d'étoiles min", rating: "la note min",
    transfer: "la durée de transfert max", beach: "la distance à la plage max",
    schengen: "le filtre Schengen",
    dest: "les destinations choisies", family: "le filtre hôtel familial"
  };
  const [key, n] = Object.entries(rejected).sort((a, b) => b[1] - a[1])[0] || [];
  return n ? `${n} séjour${n > 1 ? "s" : ""} écarté${n > 1 ? "s" : ""} par ${labels[key]}.` : "";
}

/* ==================== VALIDATION ==================== */
/** Valide selon le MODE actif. Bug original : les dates étaient exigées même en mode flexible,
    ce qui rendait la recherche impossible dans ce mode. */
function validate(f) {
  if (f.flexibleDates) {
    if (!f.selectedMonths.length) return "Choisis au moins un mois de départ.";
    if (f.tripDuration < 2) return "La durée du séjour doit être d'au moins 2 nuits.";
    return null;
  }
  if (!f.departureDate || !f.returnDate) return "Renseigne les dates de départ et de retour.";
  if (f.returnDate <= f.departureDate) return "Le retour doit être après le départ.";
  if (f.departureDate < today()) return "La date de départ est déjà passée.";
  if (f.returnDate > dernierJour()) return `Les fournisseurs ne tarifent pas au-delà de ${HORIZON_JOURS} jours.`;
  if (nightsBetween(f.departureDate, f.returnDate) > 60) return "60 nuits maximum par recherche.";
  return null;
}

/* ==================== VIEWS ==================== */
function viewForm() {
  const f = state.formData;
  const travellers = f.adults + f.children + f.babies;
  const est = search(f, state.live, state.stays);

  return `
  <section class="hero">
    <span class="eyebrow">🔥 Chasse maximale</span>
    <h1>Ton meilleur voyage,<br>au meilleur prix.</h1>
    <p>Vol, hôtel et transfert comparés ensemble — le total que tu paieras vraiment, pas un prix d'appel.</p>
    <div class="hero__stats">
      <div><div class="stat__n num">${DEALS.length}</div><div class="stat__l">Séjours suivis</div></div>
      <div><div class="stat__n num">${travellers}</div><div class="stat__l">Voyageur${travellers > 1 ? "s" : ""}</div></div>
      <div><div class="stat__n num">${est.rows.length}</div><div class="stat__l">Correspondent</div></div>
    </div>
  </section>

  ${state.error ? `<div class="alert alert--err" role="alert"><span>⚠️</span><div>${esc(state.error)}</div></div>` : ""}

  <div class="grid">

    <div class="card">
      <div class="card__head"><span class="card__ico">👥</span><span class="card__title">Voyageurs</span>
        <span class="card__hint num">${travellers} pers.</span></div>

      <div class="pax">
        <div class="field">
          <label for="adults">Adultes</label>

          <label for="children">Enfants</label>
          ${stepper("children", f.children, 0, 6)}
        </div>
        <div class="field">
          <label for="babies">Bébés</label>

      <p class="hint" style="margin:-.4rem 0 .9rem">Enfants 2–17 ans · bébés de moins de 2 ans.</p>

      ${f.children > 0 ? `
      <div class="field">
        <span class="field-label">Âge de chaque enfant</span>
        <div class="row2">

              <input class="input" type="number" id="childAge${i}" data-age="child" data-idx="${i}"

      ${f.babies > 0 ? `
      <div class="field">
        <span class="field-label">Âge de chaque bébé (mois)</span>
        <div class="row2">
          ${f.babiesAges.map((a, i) => `
            <div>
              <label class="sr-only" for="babyAge${i}">Âge bébé ${i + 1} en mois</label>
              <input class="input" type="number" id="babyAge${i}" data-age="baby" data-idx="${i}"

    <div class="card">
      <div class="card__head"><span class="card__ico">📅</span><span class="card__title">Dates</span></div>

      ${!f.flexibleDates ? `
        <div class="field" style="margin-top:.9rem">
          <label for="departureDate">Départ</label>
          <input class="input" type="date" id="departureDate" value="${esc(f.departureDate)}"

        </div>
        <div class="field">
          <label for="returnDate">Retour</label>
          <input class="input" type="date" id="returnDate" value="${esc(f.returnDate)}"
                 min="${esc(f.departureDate || today())}" max="${dernierJour()}">
          ${f.departureDate && f.returnDate && f.returnDate > f.departureDate
            ? `<span class="hint">${nightsBetween(f.departureDate, f.returnDate)} nuits sur place.</span>`
            : `<span class="hint">Choisis un départ puis un retour.</span>`}

      ` : `
        <div class="field" style="margin-top:.9rem">
          <span class="field-label" id="moisLabel">Mois de départ</span>
          <div class="months" role="radiogroup" aria-labelledby="moisLabel">
            ${MONTHS.map((m, i) => `
              <button type="button" class="month" role="radio" data-month="${i + 1}"
                      aria-checked="${f.selectedMonths.includes(i + 1)}">${m}</button>`).join("")}
          </div>
          <span class="hint">Un seul mois : c'est celui qui sera réellement interrogé chez les fournisseurs, au 15 du mois.</span>
        </div>
        <div class="field">
          <label for="tripDuration">Durée du séjour</label>
          <select class="input" id="tripDuration">
            ${[5, 7, 8, 9, 10, 12, 14, 21].map(n =>
              `<option value="${n}"${f.tripDuration === n ? " selected" : ""}>${n} nuits</option>`).join("")}
          </select>
        </div>
      `}

      <!-- Hors du ternaire : la tranche horaire vaut pour les dates précises COMME pour
           le mode flexible. Placés dans la branche « Flexible », ces deux menus étaient
           invisibles par défaut — défaut mesuré en production le 2026-09-24. -->
      <div class="field" style="margin-top:.9rem">
        <label for="departApres">Pas de décollage avant</label>
        <select class="input" id="departApres">
          <option value=""${f.departApres === null ? " selected" : ""}>Peu importe</option>
          ${[6, 7, 8, 9, 10, 12].map(h => `<option value="${h}"${f.departApres === h ? " selected" : ""}>${h} h</option>`).join("")}

      <div class="field">

        <select class="input" id="origin">
          ${AIRPORTS.map(a => `<option value="${esc(a.code)}"${f.origin === a.code ? " selected" : ""}>${esc(a.label)} (${esc(a.code)})</option>`).join("")}

        <button type="button" data-dest="specific" aria-pressed="${f.destinationType === "specific"}">Je choisis</button>

      ${f.destinationType === "specific" ? `
        <div class="field" style="margin-top:.9rem">
          <span class="field-label">Destinations retenues ${f.destinations.length ? `(${f.destinations.length})` : "— aucune = toutes"}</span>

            ${DEALS.map(d => `
              <button type="button" class="chip" data-destid="${esc(d.id)}"

      <div class="field">
        <label class="check" for="bagageSoute">

          <span>🧳 Bagage en soute inclus</span>

        <label class="check" for="familyHotel">
          <input type="checkbox" id="familyHotel"${f.familyHotel ? " checked" : ""}>

    </div>

    <div class="card">
      <div class="card__head"><span class="card__ico">💰</span><span class="card__title">Budget</span>
        <span class="card__hint">total famille</span></div>
      <div class="field">
        <div class="range-head">
          <label for="maxBudget">Budget maximum</label>
          <span class="range-val num" id="budgetOut">${eur(f.maxBudget)}</span>
        </div>
        <input type="range" id="maxBudget" min="500" max="8000" step="50" value="${f.maxBudget}">
        <span class="hint">Vol + hôtel + transfert, tout compris.</span>
      </div>
      <div class="field">
        <div class="range-head">
          <label for="maxTransfer">Transfert aéroport → hôtel</label>
          <span class="range-val num" id="transferOut">${f.maxTransfer} min</span>
        </div>

    <div class="card">
      <div class="card__head"><span class="card__ico">🏨</span><span class="card__title">Hôtel</span></div>

        <label for="minStars">Catégorie minimum</label>
        <select class="input" id="minStars">
          ${[3, 4, 5].map(s => `<option value="${s}"${f.minStars === s ? " selected" : ""}>${"★".repeat(s)} ${s} étoiles</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label for="pension">Pension</label>
        <select class="input" id="pension">
          ${Object.entries(PENSIONS).map(([k, v]) =>
            `<option value="${esc(k)}"${f.pension === k ? " selected" : ""}>${esc(v.label)}${v.mult > 1 ? ` (+${Math.round((v.mult - 1) * 100)} %)` : ""}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <div class="range-head">
          <label for="minRating">Note voyageurs min</label>
          <span class="range-val num" id="ratingOut">${f.minRating.toFixed(1)}/10</span>
        </div>
        <input type="range" id="minRating" min="6" max="9.5" step="0.1" value="${f.minRating}">
      </div>
      <div class="field">
        <div class="range-head">
          <label for="maxBeachDistance">Distance à la plage</label>
          <span class="range-val num" id="beachOut">${libellePlage(f.maxBeachDistance)}</span>
        </div>
        <input type="range" id="maxBeachDistance" min="1" max="${PLAGE_LIBRE}" step="1" value="${f.maxBeachDistance}">
        <span class="hint">Distance modélisée, comme le transfert — elle ne vient d'aucune API.</span>
      </div>

    <div class="card">
      <div class="card__head"><span class="card__ico">🎨</span><span class="card__title">Ambiance</span>
        <span class="card__hint">${f.preferences.length} sélection${f.preferences.length > 1 ? "s" : ""}</span></div>
      <div class="chips" role="group" aria-label="Préférences">
        ${PREFS.map(p => `
          <button type="button" class="chip" data-pref="${esc(p.id)}"
                  aria-pressed="${f.preferences.includes(p.id)}">${esc(p.label)}</button>`).join("")}
      </div>
      <p class="hint" style="margin-top:.7rem">Ces choix ne filtrent pas : ils remontent les séjours qui collent le mieux quand tu tries par pertinence.</p>

  <p class="footnote">Données de démonstration — aucun prix n'est interrogé en temps réel.</p>`;
}

function stepper(id, value, min, max) {
  return `<div class="stepper">
    <button type="button" data-step="${esc(id)}" data-delta="-1" aria-label="Moins"${value <= min ? " disabled" : ""}>−</button>
    <input class="input num" type="number" id="${esc(id)}" value="${esc(value)}" min="${min}" max="${max}" inputmode="numeric">
    <button type="button" data-step="${esc(id)}" data-delta="1" aria-label="Plus"${value >= max ? " disabled" : ""}>+</button>
  </div>`;
}

function viewResults() {
  const f = state.formData;

  if (state.loading) {
    const listeSources = SOURCES.map(s => {
      const etat = state.sources[s.id] || "attente";
      const e = etiquetteSource(etat, state.sourcesN[s.id] || 0);
      return `<div class="src ${e.classe}">
        <span class="src__mono" style="background:${s.teinte}" aria-hidden="true">${s.initiale}</span>
        <span class="src__txt">
          <span class="src__nom">${esc(nomSource(s.id, state.staysFournisseur))}</span><br>
          <span class="src__couvre">${esc(s.couvre)}</span>
        </span>
        <span class="src__etat">${esc(e.texte)}</span>
      </div>`;
    }).join("");

    return `<section class="hero"><h1>Chasse en cours…</h1>
      <p>Comparaison vol + hôtel + transfert sur ${DEALS.length} séjours.</p>
      <div class="srcs">${listeSources}</div></section>
      <div class="deals">${Array.from({ length: 3 }, () => `
        <div class="skeleton">
          <div class="sk" style="height:18px;width:55%"></div>
          <div class="sk" style="height:32px;width:35%;margin-top:.8rem"></div>
          <div class="sk" style="height:12px;width:100%;margin-top:1.2rem"></div>
          <div class="sk" style="height:12px;width:88%;margin-top:.5rem"></div>
          <div class="sk" style="height:12px;width:70%;margin-top:.5rem"></div>
          <div class="sk" style="height:7px;width:100%;margin-top:1.2rem"></div>
        </div>`).join("")}</div>`;
  }

  const rows = sortRows(state.results, state.sort);
  const period = f.flexibleDates
    ? `${f.selectedMonths.map(m => MONTHS[m - 1]).join(", ")} · ${f.tripDuration} nuits`
    : `${f.departureDate} → ${f.returnDate}`;

  const etatHotels = {
    "reel": state.staysMode === "test"
      ? `Tarifs hôteliers de bac à sable via ${state.staysFournisseur === "liteapi" ? "LiteAPI" : "Duffel Stays"} : données d'exemple, non réservables.`
      : `Tarifs hôteliers réels via ${state.staysFournisseur === "liteapi" ? "LiteAPI" : "Duffel Stays"}.`,
    "non-configure": "Hôtel estimé par le modèle local — aucune clé hôtelière configurée.",
    "erreur": "Hôtel estimé par le modèle local — l'API hôtelière n'a rien renvoyé d'exploitable."
  }[state.staysStatus] || "";

  const bandeau = {
    // Le titre lui-même doit dire la vérité : « Tarifs de vol réels » suivi de
    // « prix fictifs » se lisait comme une promesse corrigée en petit.
    "reel": state.liveMode === "test"
      ? `<div class="alert alert--warn"><span>🧪</span><div><b>Tarifs de test</b> — Duffel répond en <b>bac à sable</b> au départ de ${esc(f.origin)} : horaires et prix <b>fictifs</b>, non réservables. ${esc(etatHotels)} Le transfert reste estimé.</div></div>`
      : `<div class="alert alert--info"><span>📡</span><div><b>Tarifs de vol réels</b> — remontés par Duffel au départ de ${esc(f.origin)}. ${esc(etatHotels)} Le transfert reste estimé.</div></div>`,
    // Les trois branches ci-dessous ne parlent que des VOLS : elles annonçaient « aucun
    // tarif réel n'est interrogé » alors que les hôtels pouvaient être branchés, et elles
    // taisaient l'état hôtelier. D'où la reformulation, et le rappel dans chacune.
    "non-configure": `<div class="alert alert--warn"><span>⚙️</span><div><b>Vols de démonstration</b> — la variable <code>DUFFEL_TOKEN</code> n'est pas définie côté serveur, aucun tarif de vol réel n'est interrogé. ${esc(etatHotels)}</div></div>`,
    "erreur": `<div class="alert alert--warn"><span>⚠️</span><div><b>Repli sur la démonstration</b> — l'API de vols n'a rien renvoyé d'exploitable pour ce départ. Les prix de vol affichés sont modélisés. ${esc(etatHotels)}</div></div>`,
    "devise": `<div class="alert alert--warn"><span>💱</span><div><b>Devise incompatible</b> — ton compte Duffel facture dans une autre devise que l'euro. Les tarifs de vol réels ont été écartés plutôt que d'être additionnés à tort à des prix d'hôtel en euros. Règle la devise du compte sur EUR. ${esc(etatHotels)}</div></div>`
  }[state.liveStatus] || "";

  const head = `
    <section class="hero" style="padding-bottom:.5rem">
      <span class="eyebrow">Résultats</span>
      <h1>${rows.length} séjour${rows.length > 1 ? "s" : ""} sous ${eur(f.maxBudget)}</h1>
      <p>${esc(period)} · au départ de ${esc(f.origin)} · ${f.adults} adulte${f.adults > 1 ? "s" : ""}${f.children ? `, ${f.children} enfant${f.children > 1 ? "s" : ""}` : ""}${f.babies ? `, ${f.babies} bébé${f.babies > 1 ? "s" : ""}` : ""} · ${esc(PENSIONS[f.pension].label)}</p>
    </section>
    ${bandeau}
    ${messageVeille()}`;

  if (!rows.length) {
    return head + `<div class="empty">
      <div class="empty__ico">🧭</div>
      <h3>Aucun séjour ne passe tes filtres</h3>
      <p>${esc(state.lastReason || "")} Remonte le budget, baisse les étoiles ou allonge le transfert accepté.</p>
      <button class="btn btn--primary" style="margin-top:1.2rem" onclick="goBack()">← Ajuster la recherche</button>
    </div>`;
  }

  const sortBtn = (id, label) =>
    `<button type="button" class="chip" data-sort="${id}" aria-pressed="${state.sort === id}">${label}</button>`;

  return head + `
    <div class="results-head">
      <span class="count">Trié par ${state.sort === "price" ? "prix" : state.sort === "score" ? "pertinence" : "note"}</span>
      <div class="sortbar">${sortBtn("price", "💶 Prix")}${sortBtn("score", "🎯 Pertinence")}${sortBtn("rating", "⭐ Note")}</div>
    </div>
    <div class="deals">${rows.map((r, i) => dealCard(r, i, f)).join("")}</div>
    <p class="footnote">${noteComposition(state.liveStatus === "reel", state.staysStatus === "reel", r0(), state.liveMode, state.staysMode)} Les liens ouvrent une vraie recherche chez le fournisseur.</p>`;

  function r0() { return rows[0].nights; }
}

/**
 * Décrit la composition du total selon ce qui est RÉELLEMENT réel, composant par composant.
 * La note précédente annonçait « Prix de démonstration calculés localement (vol × voyageurs
 * + N nuits) » quelle que soit la situation : dès qu'un tarif Duffel arrivait, elle
 * contredisait le bandeau juste au-dessus, et sa formule était fausse — un tarif réel est
 * pris tel quel, jamais multiplié par les voyageurs.
 */
/**
 * Les sources RÉELLEMENT interrogées pendant une chasse. Cette liste pilote
 * l'animation de chargement : elle ne peut donc pas annoncer un fournisseur
 * qu'on n'appelle pas. Ajouter un fournisseur = une entrée ici + son appel dans
 * hunt(), et l'animation suit toute seule.
 *
 * Volontairement AUCUN logo tiers : un monogramme neutre. Afficher la marque
 * d'un service qu'on n'interroge pas serait un mensonge ; afficher celle d'un
 * service qu'on interroge suggérerait un partenariat qui n'existe pas.
 */
const SOURCES = [
  { id: "vols",   couvre: "Vols",                 initiale: "D", teinte: "#5b5bd6" },
  { id: "hotels", couvre: "Hébergements",         initiale: "H", teinte: "#12a594" },
  { id: "modele", couvre: "Transfert et modèle",  initiale: "M", teinte: "#8a8f98" }
];

/**
 * Ce que le tarif inclut, en une ligne. Trois états, et le troisième compte autant que
 * les deux autres : quand l'amont ne déclare rien, on le dit — « non communiqués » n'est
 * pas « aucun bagage ».
 */
function texteBagages(b) {
  if (!b || (b.soute === null && b.cabine === null)) return "bagages non communiqués";
  const morceaux = [];
  if (b.soute !== null) morceaux.push(b.soute > 0 ? `${b.soute} en soute` : "pas de soute");
  if (b.cabine !== null) morceaux.push(b.cabine > 0 ? `${b.cabine} en cabine` : "pas de cabine");
  return morceaux.join(" · ");
}

/**
 * Badge du composant vol. « Réel » est réservé à un tarif que le voyageur peut
 * réellement payer.
 *
 * En bac à sable, Duffel renvoie des horaires et des prix INVENTÉS. Le badge
 * disait pourtant « vol réel » en vert, au-dessus de chaque carte, pendant que
 * le bandeau annonçait « prix fictifs » — et c'est le badge qu'on lit. Un
 * comparateur qui publie des prix inventés sous une étiquette « réel » est
 * trompeur, quelle que soit la petite ligne au-dessus.
 */
function badgeVol(reel, mode) {
  if (!reel) return { texte: "vol démo", classe: "badge--demo" };
  return mode === "test"
    ? { texte: "vol test", classe: "badge--test" }
    : { texte: "vol réel", classe: "badge--ok" };
}

/**
 * Badge du composant hôtel, même règle que le vol. LiteAPI distribue gratuitement une clé
 * `sand_…` qui répond avec des données d'exemple : un tarif remonté n'est pas pour autant
 * un tarif payable. `/api/stays` publie `mode`, la page le lit, et « réel » reste réservé
 * à une clé de production.
 */
function badgeHotel(reel, mode) {
  if (!reel) return { texte: "hôtel démo", classe: "badge--demo" };
  return mode === "test"
    ? { texte: "hôtel test", classe: "badge--test" }
    : { texte: "hôtel réel", classe: "badge--ok" };
}

/** Nom affiché d'une source : il dépend du fournisseur réellement retenu. */
function nomSource(id, fournisseur) {
  if (id === "vols") return "Duffel Air";
  if (id === "modele") return "Modèle local";
  return { liteapi: "LiteAPI", duffel: "Duffel Stays" }[fournisseur] || "API hôtelière";
}

/** Libellé d'état d'une source. Jamais « résultats » quand rien n'est revenu. */
function etiquetteSource(statut, n) {
  return {
    attente: { texte: "en attente",     classe: "src--attente" },
    encours: { texte: "interrogation…", classe: "src--encours" },
    ok:      { texte: `${n} résultat${n > 1 ? "s" : ""}`, classe: "src--ok" },
    vide:    { texte: "aucune offre",   classe: "src--vide" },
    absent:  { texte: "non configurée", classe: "src--absent" }
  }[statut] || { texte: "—", classe: "src--attente" };
}

/** Traduit la réponse d'un proxy en état de source, sans jamais l'embellir. */
function etatDepuisReponse(statut, n) {
  if (statut === "non-configure") return "absent";
  if (statut === "reel") return n > 0 ? "ok" : "vide";
  return "vide";
}

/**
 * Lien Google Flights préremplí.
 *
 * L'ancienne version envoyait `vols PAR Faro 2026-11-05` : du français, un NOM DE VILLE,
 * et pas de date de retour. Google Flights n'analyse `?q=` qu'en anglais — il retombait
 * donc sur un formulaire vide, à ressaisir à la main. Les codes IATA lèvent en prime
 * l'ambiguïté des noms de ville (Faro au Portugal, mais aussi au Brésil).
 */
function lienVols(origine, iata, depart, retour) {
  const q = depart
    ? `Flights to ${iata} from ${origine} on ${depart}${retour ? ` through ${retour}` : ""}`
    : `Flights to ${iata} from ${origine}`;
  return "https://www.google.com/travel/flights?q=" + encodeURIComponent(q);
}

/**
 * Lien Booking. Quand le tarif est réel mais que l'amont n'a pas donné le nom de
 * l'établissement, on cherche la ville — pas l'hôtel de démonstration, qui enverrait
 * sur un AUTRE hôtel que celui dont le prix est affiché.
 *
 * Le séjour est recopié dans l'URL — dates, voyageurs, âges, nombre de chambres —
 * pour que la recherche ouverte soit celle qui a produit le prix affiché, et non un
 * formulaire vide aux dates du jour. `rooms` vient de `priceDeal`, jamais recalculé
 * ici : la règle des chambres ne doit vivre qu'à un seul endroit dans cette page.
 *
 * ⚠️ Non vérifié de bout en bout : Booking sert une page dégradée à l'automatisation,
 * impossible de constater de l'extérieur qu'il honore ces paramètres. Ce qui EST
 * vérifié, par l'auto-test, c'est que l'URL les porte. Appelé sans `f` (les anciens
 * appels, et l'auto-test du nom), le lien reste exactement celui d'avant.
 */
function lienHotel(nom, ville, f, rooms) {
  const q = nom ? `${nom}, ${ville}` : `hôtels ${ville}`;
  let url = "https://www.booking.com/searchresults.html?ss=" + encodeURIComponent(q);
  if (!f) return url;

  if (!f.flexibleDates && f.departureDate && f.returnDate) {
    url += `&checkin=${encodeURIComponent(f.departureDate)}&checkout=${encodeURIComponent(f.returnDate)}`;
  }
  // Booking ne connaît pas les bébés : ce sont des enfants d'âge 0 ou 1, comme chez
  // les deux fournisseurs hôteliers (`invites()` dans stays.mjs fait le même calcul).
  const ages = [...(f.childrenAges || []), ...(f.babiesAges || []).map(m => Math.min(1, Math.max(0, Math.floor(int(m) / 12))))];
  url += `&group_adults=${int(f.adults, 1)}&group_children=${ages.length}&no_rooms=${Math.max(1, int(rooms, 1))}`;
  for (const a of ages) url += `&age=${int(a)}`;
  return url;
}

function noteComposition(volReel, hotelReel, nuits, mode, modeHotel) {
  const vol = volReel
    ? (mode === "test"
        ? "vol au tarif de test Duffel, non réservable"
        : "vol au tarif réel, tous voyageurs compris")
    : "vol modélisé (tarif de base × voyageurs)";
  const hotel = hotelReel
    ? (modeHotel === "test"
        ? "hôtel au tarif de bac à sable, non réservable"
        : "hôtel au tarif réel, séjour entier")
    : `hôtel modélisé (${nuits} nuit${nuits > 1 ? "s" : ""} × chambres × pension)`;
  return `Composition du total : ${vol} + ${hotel} + transfert estimé.`;
}

/** Détail hôtel : données réelles quand le tarif l'est, sinon celles du jeu de démonstration. */
function detailHotel(r) {
  const etoiles = Number.isFinite(r.hotelEtoiles) ? r.hotelEtoiles : (r.hotelReel ? null : r.stars);
  const note = Number.isFinite(r.hotelNote) ? r.hotelNote : (r.hotelReel ? null : r.rating);
  const bouts = [];
  if (Number.isFinite(etoiles) && etoiles > 0) bouts.push("★".repeat(Math.min(5, Math.round(etoiles))));
  if (Number.isFinite(note) && note > 0) bouts.push(`${note}/10`);
  if (r.hotelReel && r.hotelPension) bouts.push(r.hotelPension);
  else bouts.push(`${r.rooms} chambre${r.rooms > 1 ? "s" : ""}`);
  return bouts.join(" · ");
}

/** Horaires de la carte : ceux de Duffel quand le tarif est réel, sinon ceux du jeu de démonstration. */
function horaireVol(r) {
  if (!r.departReel) return r.times;
  const h = iso => {
    const m = String(iso).match(/T(\d{2}):(\d{2})/);
    return m ? `${m[1]}:${m[2]}` : null;
  };
  const aller = h(r.departReel);
  if (!aller) return r.times;
  const escales = r.escalesReelles === 0 ? "direct"
    : r.escalesReelles > 0 ? `${r.escalesReelles} escale${r.escalesReelles > 1 ? "s" : ""}`
    : null;
  const retour = h(r.retourReel);
  // L'atterrissage du retour, quand la source le donne : c'est l'heure à laquelle on
  // rentre chez soi, et c'est elle que le filtre « retour posé avant » respecte.
  const pose = h(r.arriveeRetourReel);
  const bloc = retour ? ` · retour ${retour}${pose && pose !== retour ? ` → ${pose}` : ""}` : "";
  return `départ ${aller}${bloc}${escales ? ` · ${escales}` : ""}`;
}

          <span class="badge ${bh.classe}">${esc(bh.texte)}</span></div>
      </div>
      <div class="deal__price">
        <div class="deal__total num">${eur(r.total)}</div>
        <div class="deal__per num">≈ ${eur(per)} / pers.</div>
      </div>
    </div>

    <div class="specs">
      <div class="spec"><span aria-hidden="true">✈️</span><span class="spec__k">Vol</span>
        <span class="spec__v">${esc(r.compagnieReelle || r.airline)}<small>${esc(horaireVol(r))}</small></span></div>
      <div class="spec"><span aria-hidden="true">🏨</span><span class="spec__k">Hôtel</span>
        <span class="spec__v">${esc(r.hotelNom || (r.hotelReel ? "Établissement non communiqué" : r.hotel))}<small>${esc(detailHotel(r))}</small></span></div>
      <div class="spec"><span aria-hidden="true">🏖️</span><span class="spec__k">Plage</span>
        <span class="spec__v num">${r.beachKm < 1 ? Math.round(r.beachKm * 1000) + " m" : r.beachKm + " km"}</span></div>
      <div class="spec"><span aria-hidden="true">🧳</span><span class="spec__k">Bagages</span>

      <div class="spec"><span aria-hidden="true">🚕</span><span class="spec__k">Transfert</span>

function viewActionBar() {

    <button class="btn btn--ghost" onclick="ouvrirVeilles()" title="Mes veilles">🔔<span class="sr-only"> Mes veilles</span></button>
    <button class="btn btn--hunt" onclick="hunt()"${state.loading ? " disabled" : ""}>🔥 Chasser<span class="wide-only"> le meilleur voyage</span></button>
  </div>`;
